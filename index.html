<body class="text-slate-800 antialiased pb-safe">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Music, Calendar as CalendarIcon, CheckCircle, Clock, Plus, 
            Trash2, Activity, Save, ChevronDown, ChevronRight, BookOpen, 
            ChevronLeft, AlertCircle, CheckSquare, Zap, Target,
            Sunrise, Play, Pause, Minus, Download, Upload, Settings, FileDown, FileUp,
            Shuffle, RefreshCw, List, X, Info, LifeBuoy, Sparkles, Search, Bot, KeyRound,
            Quote, Cloud, CloudOff, Loader2, Smartphone, UserCircle, Link as LinkIcon, Copy, LogOut,
            Volume2, VolumeX
        } from 'lucide-react';

        // --- Data Constants ---
        const MAJOR_SCALES = [ "C 大調", "G 大調", "D 大調", "A 大調", "E 大調", "B 大調", "F# 大調", "Db 大調", "Ab 大調", "Eb 大調", "Bb 大調", "F 大調" ];
        const MINOR_SCALES = [ "a 小調", "e 小調", "b 小調", "f# 小調", "c# 小調", "g# 小調", "d# 小調", "bb 小調", "f 小調", "c 小調", "g 小調", "d 小調" ];
        const ERAS = [
            { id: 'baroque', name: '巴洛克 (Baroque)', color: 'bg-amber-50 text-amber-700 border-amber-200' },
            { id: 'classical', name: '古典 (Classical)', color: 'bg-blue-50 text-blue-700 border-blue-200' },
            { id: 'romantic', name: '浪漫 (Romantic)', color: 'bg-rose-50 text-rose-700 border-rose-200' },
            { id: 'modern', name: '現代 (Modern)', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
        ];
        
        const MOTIVATIONAL_QUOTES = [
            "練習不是追求完美，而是追求進步。",
            "慢練是通往快速演奏的唯一捷徑。",
            "讓每一個音符都成為你靈魂的迴響。",
            "今天的汗水，是為了明天舞台上的聚光燈。",
            "不要只是彈奏音符，要彈奏出音樂。",
            "持之以恆的平庸勝過一時的輝煌。",
            "錯誤是最好的老師，請擁抱它們。",
            "音樂始於語言終止之處。",
            "用耳朵去聽，用心去感受。",
            "鋼琴是黑白鍵上的色彩魔術師。",
            "專注於當下的每一個音，未來自然會成形。",
            "節奏是音樂的心跳，旋律是音樂的靈魂。",
            "簡單的事情重複做，你就是專家。",
            "音樂是流動的建築，建築是凝固的音樂。",
            "只有在最深的靜默中，才能聽見最美的樂章。"
        ];

        const getDayOfYear = (date = new Date()) => {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        };

        const getScalesForDate = (date) => {
            const dayIndex = getDayOfYear(date) % MAJOR_SCALES.length;
            return { major: MAJOR_SCALES[dayIndex], minor: MINOR_SCALES[dayIndex], index: dayIndex };
        };

        const getLocalDateString = (date) => {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const ProgressBar = ({ current, total, colorClass = "bg-indigo-500" }) => {
            const percentage = Math.min(100, Math.max(0, (current / total) * 100));
            return (
                <div className="h-2 w-full bg-slate-100 rounded-full overflow-hidden mt-2">
                    <div className={`h-full transition-all duration-500 ease-out ${colorClass}`} style={{ width: `${percentage}%` }} />
                </div>
            );
        };

        const generateRandomId = () => {
            return 'PIANO-' + Math.floor(100000 + Math.random() * 900000);
        };

        // --- Firebase Init ---
        const waitForFirebase = async () => {
            while (!window.firebaseModules) {
                await new Promise(resolve => setTimeout(resolve, 50));
            }
            return window.firebaseModules;
        };

        // --- AI Search Component ---
        const MusicAIAssistant = ({ apiKey }) => {
            const [query, setQuery] = useState("");
            const [result, setResult] = useState(null);
            const [isSearching, setIsSearching] = useState(false);

            const handleSearch = (e) => {
                e.preventDefault();
                performSearch(query);
            };

            const performSearch = async (searchTerm) => {
                if (!searchTerm.trim()) return;
                setQuery(searchTerm);
                setIsSearching(true);
                setResult(null);

                // 1. Check API Key
                if (!apiKey) {
                    setResult({
                        type: 'error',
                        text: "尚未設定 API 金鑰。請前往「設定」頁面輸入您的 Gemini API Key 才能使用 AI 查詢功能。",
                        source: 'System'
                    });
                    setIsSearching(false);
                    return;
                }

                // 2. Call Gemini API
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `你是權威的音樂學術百科與教育家。請針對音樂術語、作曲家或作品：「${searchTerm}」提供精準、專業且具深度的解析。
                                    
                                    請遵循以下格式與原則：
                                    1. **核心定義**：精簡準確地解釋該詞彙。
                                    2. **關鍵重點**：列點說明其語源、音樂特性、歷史背景、風格特點或演奏要點。
                                    3. **專業詳解**：直接切入重點，提供詳盡的資訊，不限字數，越詳細越好。
                                    
                                    語氣請保持客觀、學術且專業。如果這完全不是音樂相關術語，請禮貌告知。`
                                }]
                            }]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error?.message || `API Request Failed: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (aiText) {
                        setResult({ type: 'found', text: aiText, source: 'Gemini' });
                    } else {
                        throw new Error('No content in response');
                    }

                } catch (error) {
                    console.error("AI Error:", error);
                    let errorMessage = "連線不穩定，AI 暫時無法回應。";
                    
                    if (error.message.includes('API key not valid')) {
                        errorMessage = "API Key 無效，請檢查設定頁面中的金鑰是否正確。";
                    } else if (error.message.includes('403') || error.message.includes('permission')) {
                        errorMessage = "權限不足或 API Key 有誤。請確認您的 Google Cloud 專案權限。";
                    } else if (error.message.includes('404') || error.message.includes('not found')) {
                         errorMessage = "找不到模型。這可能是 API Key 的權限問題，請確認已啟用 Generative Language API。";
                    }

                    setResult({
                        type: 'error',
                        text: `${errorMessage} (錯誤代碼: ${error.message})`,
                        source: 'System'
                    });
                } finally {
                    setIsSearching(false);
                }
            };

            const quickTerms = ["Rubato", "Sonata", "Cadenza", "Etude", "Bach", "Chopin"];

            return (
                <div className="space-y-6">
                    <div className="relative overflow-hidden rounded-3xl p-[1px] transition-all hover:shadow-lg">
                        <div className="absolute inset-0 bg-gradient-to-br from-indigo-400 via-purple-400 to-pink-400 opacity-30"></div>
                        <div className="relative bg-white/90 backdrop-blur-xl rounded-3xl p-6">
                            <div className="absolute -top-10 -right-10 w-32 h-32 bg-purple-200 rounded-full blur-3xl opacity-50"></div>
                            <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-indigo-200 rounded-full blur-3xl opacity-50"></div>

                            <div className="relative z-10">
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-md">
                                            <Sparkles size={20} />
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-slate-800 text-lg">AI 音樂百科</h3>
                                            <p className="text-xs text-slate-500 font-medium">您的隨身音樂辭典 (Gemini Powered)</p>
                                        </div>
                                    </div>
                                </div>

                                <form onSubmit={handleSearch} className="relative group">
                                    <div className="absolute inset-0 bg-gradient-to-r from-indigo-200 to-purple-200 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                                    <input 
                                        type="text" 
                                        className="relative w-full bg-white border-0 rounded-2xl pl-12 pr-12 py-4 text-slate-700 placeholder-slate-400 shadow-sm ring-1 ring-slate-100 focus:ring-2 focus:ring-indigo-500/50 focus:outline-none transition-all text-sm font-medium"
                                        placeholder="想查詢什麼音樂術語？ (例: Sonata, Bach...)"
                                        value={query}
                                        onChange={(e) => setQuery(e.target.value)}
                                    />
                                    <Search size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-hover:text-indigo-500 transition-colors" />
                                    <button 
                                        type="submit" 
                                        className="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-indigo-50 rounded-xl text-indigo-600 hover:bg-indigo-600 hover:text-white transition-all disabled:opacity-50"
                                        disabled={isSearching}
                                    >
                                        {isSearching ? <div className="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></div> : <ChevronRight size={20} />}
                                    </button>
                                </form>

                                {result && (
                                    <div className="mt-4 animate-slideUp">
                                        <div className={`p-4 rounded-2xl border ${result.type !== 'error' ? 'bg-indigo-50/50 border-indigo-100' : 'bg-rose-50 border-rose-100'}`}>
                                            <div className="flex gap-3">
                                                <div className={`mt-0.5 flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center ${result.type !== 'error' ? 'bg-indigo-100 text-indigo-600' : 'bg-rose-200 text-rose-500'}`}>
                                                    {result.type !== 'error' ? <Bot size={14}/> : <Info size={14}/>}
                                                </div>
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className={`text-xs font-bold ${result.type !== 'error' ? 'text-indigo-600' : 'text-rose-600'}`}>
                                                            {result.source === 'Local' ? '⚡ 快速查詢' : (result.source === 'Gemini' ? '✨ AI 專業解析' : '⚠️ 系統提示')}
                                                        </span>
                                                    </div>
                                                    <p className="text-sm text-slate-700 leading-relaxed font-medium whitespace-pre-wrap">
                                                        {result.text}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    <div>
                        <h4 className="text-sm font-bold text-slate-400 mb-3 px-2">常用詞條捷徑</h4>
                        <div className="flex flex-wrap gap-2">
                            {quickTerms.map(term => (
                                <button key={term} onClick={() => performSearch(term)} className="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:border-indigo-300 hover:text-indigo-600 hover:shadow-sm transition active:scale-95">
                                    {term}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        function PianoTrackerProAI() {
            const [activeTab, setActiveTab] = useState('daily');
            const [semesters, setSemesters] = useState([]);
            const [dailyLogs, setDailyLogs] = useState({});
            const [currentScale, setCurrentScale] = useState({ major: "", minor: "", isCustom: false });
            const [viewDate, setViewDate] = useState(new Date()); 
            const [metronomeOn, setMetronomeOn] = useState(false);
            const [bpm, setBpm] = useState(126);
            const [timeSignature, setTimeSignature] = useState(4);
            const [isSemesterModalOpen, setIsSemesterModalOpen] = useState(false);
            const [newSemesterName, setNewSemesterName] = useState("");
            const [showScaleSelector, setShowScaleSelector] = useState(false);
            const [userApiKey, setUserApiKey] = useState("");
            
            // Metronome Enhanced States
            const [activeBeat, setActiveBeat] = useState(-1);
            const [isMuted, setIsMuted] = useState(false);
            
            // Cloud Sync States
            const [user, setUser] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [firebaseError, setFirebaseError] = useState(null);
            
            // Custom Sync ID
            const [syncId, setSyncId] = useState("");
            const [inputSyncId, setInputSyncId] = useState("");
            
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            const audioCtxRef = useRef(null);
            const nextNoteTimeRef = useRef(0.0);
            const timerIDRef = useRef(null);
            const beatCountRef = useRef(0);
            
            // Metronome Refs to ensure loop reads latest state
            const bpmRef = useRef(bpm);
            const timeSignatureRef = useRef(timeSignature);
            const isMutedRef = useRef(isMuted);

            // Update refs when state changes
            useEffect(() => { bpmRef.current = bpm; }, [bpm]);
            useEffect(() => { timeSignatureRef.current = timeSignature; }, [timeSignature]);
            useEffect(() => { isMutedRef.current = isMuted; }, [isMuted]);

            // --- 1. Firebase Initialization & Auth ---
            useEffect(() => {
                const initFirebase = async () => {
                    try {
                        const fb = await waitForFirebase();
                        
                        // Check if config exists (handle local execution)
                        if (typeof __firebase_config === 'undefined') {
                            throw new Error("找不到 Firebase 設定，將使用本機模式 (Local Mode)。");
                        }

                        let firebaseConfig;
                        try {
                            firebaseConfig = JSON.parse(__firebase_config);
                        } catch (e) {
                            throw new Error("Firebase 設定檔格式錯誤。");
                        }

                        const app = fb.initializeApp(firebaseConfig);
                        const authInstance = fb.getAuth(app);
                        const dbInstance = fb.getFirestore(app);
                        
                        setAuth(authInstance);
                        setDb(dbInstance);

                        const unsubscribe = fb.onAuthStateChanged(authInstance, (u) => {
                            setUser(u);
                            if (u) {
                                setFirebaseError(null); // Clear errors on success
                                const savedKey = localStorage.getItem('piano_api_key');
                                if (savedKey) setUserApiKey(savedKey);
                                const savedSyncId = localStorage.getItem('piano_sync_id');
                                if (savedSyncId) {
                                    setSyncId(savedSyncId);
                                }
                            }
                        });

                        // Auth Flow
                        try {
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await fb.signInWithCustomToken(authInstance, __initial_auth_token);
                            } else {
                                await fb.signInAnonymously(authInstance);
                            }
                        } catch (authErr) {
                            console.error("Auth Failed:", authErr);
                            setFirebaseError("認證失敗，請檢查網路連線。");
                        }

                        return () => unsubscribe();

                    } catch (err) {
                        console.error("Firebase Init Failed:", err);
                        setFirebaseError(err.message);
                    }
                };
                
                // Load local data first regardless of cloud status
                const savedSemesters = localStorage.getItem('piano_semesters_ai');
                if (savedSemesters) setSemesters(JSON.parse(savedSemesters));
                else {
                    setSemesters([{
                        id: Date.now(),
                        name: '2026 第一學期',
                        eras: { baroque: [], classical: [], romantic: [], modern: [] }
                    }]);
                }
                const savedLogs = localStorage.getItem('piano_logs_ai');
                if (savedLogs) setDailyLogs(JSON.parse(savedLogs));

                initFirebase();
            }, []);

            // --- 2. Data Synchronization (Firestore) ---
            useEffect(() => {
                if (!user || !db || !window.firebaseModules) return;

                const { doc, onSnapshot, setDoc } = window.firebaseModules;
                
                let targetDocRef;
                
                if (syncId) {
                     // Public shared path for custom sync (Transfer Code Mode)
                     targetDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_sync_data', syncId);
                } else {
                     // Private path (Local/Anonymous Mode)
                     targetDocRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'backup');
                }

                const unsubSync = onSnapshot(targetDocRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        if (data.semesters) setSemesters(data.semesters);
                        if (data.logs) setDailyLogs(data.logs);
                        if (data.apiKey && !userApiKey) setUserApiKey(data.apiKey);
                    } else {
                        // If document doesn't exist but we have local data, initialize it
                        // Only do this if we are NOT switching to a new sync ID
                        if (semesters.length > 0 || Object.keys(dailyLogs).length > 0) {
                            setDoc(targetDocRef, { 
                                semesters, 
                                logs: dailyLogs, 
                                apiKey: userApiKey,
                                lastUpdated: new Date().toISOString() 
                            }, { merge: true });
                        }
                    }
                }, (error) => {
                    console.error("Sync Error", error);
                    setFirebaseError("同步失敗: " + error.message);
                });

                return () => unsubSync();
            }, [user, db, syncId]);


            // --- Cloud Save Helpers ---
            const saveData = async (newSemesters, newLogs, key) => {
                // Always save to local storage as backup
                if (newSemesters) localStorage.setItem('piano_semesters_ai', JSON.stringify(newSemesters));
                if (newLogs) localStorage.setItem('piano_logs_ai', JSON.stringify(newLogs));
                if (key) localStorage.setItem('piano_api_key', key);

                if (!user || !db) return; // Stop if offline
                
                setIsSyncing(true);
                const { doc, setDoc } = window.firebaseModules;
                
                try {
                    let targetRef;
                    if (syncId) {
                        targetRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_sync_data', syncId);
                    } else {
                        targetRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'backup');
                    }

                    await setDoc(targetRef, {
                        semesters: newSemesters !== undefined ? newSemesters : semesters,
                        logs: newLogs !== undefined ? newLogs : dailyLogs,
                        apiKey: key !== undefined ? key : userApiKey,
                        lastUpdated: new Date().toISOString()
                    }, { merge: true });

                } catch (e) { 
                    console.error("Save error", e);
                    setFirebaseError("儲存失敗 (僅存於本機)");
                }
                setIsSyncing(false);
            };

            const handleCreateSyncId = () => {
                const newId = generateRandomId();
                if(confirm(`確定要產生新的同步碼嗎？\n\n新代碼：${newId}\n\n目前的資料將會上傳至此代碼。`)) {
                    setSyncId(newId);
                    localStorage.setItem('piano_sync_id', newId);
                    // Force save current data to new ID
                    saveData(semesters, dailyLogs, userApiKey);
                    alert(`同步碼已建立：${newId}\n請在其他裝置輸入此代碼以同步資料。`);
                }
            };

            const handleConnectSyncId = () => {
                const id = inputSyncId.trim().toUpperCase();
                if (!id.startsWith('PIANO-') || id.length < 10) {
                    return alert("無效的格式。代碼應為 PIANO-XXXXXX");
                }
                
                if (confirm(`確定要連結至同步碼：${id} 嗎？\n\n警告：本機目前的資料將會被雲端資料覆蓋！`)) {
                    setSyncId(id);
                    localStorage.setItem('piano_sync_id', id);
                    setInputSyncId("");
                    alert("已切換同步來源，正在下載資料...");
                }
            };

            const handleDisconnect = () => {
                if(confirm("確定要解除同步嗎？\n資料將保留在裝置上，但不再接收雲端更新。")) {
                    setSyncId("");
                    localStorage.removeItem('piano_sync_id');
                    alert("已解除同步，回到本機模式。");
                }
            };
            
            const handleCopyId = () => {
                navigator.clipboard.writeText(syncId);
                alert("已複製同步碼！");
            };

            // Set current scale based on date (derived state)
            useEffect(() => {
                if (!dailyLogs) return;
                const today = getLocalDateString(new Date());
                const dailyDefault = getScalesForDate(new Date());
                const logForToday = dailyLogs[today];
                
                if (logForToday && logForToday.customScale) {
                     setCurrentScale({ ...logForToday.customScale, isCustom: true });
                } else {
                     setCurrentScale({ ...dailyDefault, isCustom: false });
                }
                
                if (logForToday?.targetSpeed) {
                    setBpm(logForToday.targetSpeed);
                }
            }, [dailyLogs]);

            const handleSaveApiKey = (key) => {
                setUserApiKey(key);
                saveData(undefined, undefined, key);
                alert("API Key 已儲存！");
            };

            // Handlers
            const handleAddSemester = () => {
                if (!newSemesterName.trim()) return;
                const newSem = { id: Date.now(), name: newSemesterName, eras: { baroque: [], classical: [], romantic: [], modern: [] } };
                const updated = [newSem, ...semesters];
                setSemesters(updated);
                saveData(updated, undefined, undefined);
                setNewSemesterName("");
                setIsSemesterModalOpen(false);
            };

            const handleDeleteSemester = (id) => {
                if (confirm('確定要刪除這個學期及其所有曲目嗎？')) {
                    const updated = semesters.filter(s => s.id !== id);
                    setSemesters(updated);
                    saveData(updated, undefined, undefined);
                }
            };

            const handleExtendDeadline = (semesterId, eraId, pieceId) => {
                if(!confirm("這將會把此曲目的目標日期往後延一天，以減輕您每日的練習負擔。確定嗎？")) return;
                const updated = semesters.map(sem => {
                    if (sem.id !== semesterId) return sem;
                    return {
                        ...sem, eras: { ...sem.eras, [eraId]: sem.eras[eraId].map(p => {
                            if (p.id !== pieceId) return p;
                            const currentDate = new Date(p.targetDate);
                            currentDate.setDate(currentDate.getDate() + 1);
                            return { ...p, targetDate: getLocalDateString(currentDate) };
                        })}
                    };
                });
                setSemesters(updated);
                saveData(updated, undefined, undefined);
            };

            const handleRandomScale = () => {
                const randomIndex = Math.floor(Math.random() * MAJOR_SCALES.length);
                const newScale = { major: MAJOR_SCALES[randomIndex], minor: MINOR_SCALES[randomIndex], index: randomIndex };
                setCurrentScale({ ...newScale, isCustom: true });
                updateDailyLog('customScale', newScale);
            };
            
            const handleSelectScale = (index) => {
                const newScale = { major: MAJOR_SCALES[index], minor: MINOR_SCALES[index], index: index };
                setCurrentScale({ ...newScale, isCustom: true });
                updateDailyLog('customScale', newScale);
                setShowScaleSelector(false);
            };

            const handleResetScale = () => {
                const dailyDefault = getScalesForDate(new Date());
                setCurrentScale({ ...dailyDefault, isCustom: false });
                updateDailyLog('customScale', null);
            };

            const updateDailyLog = (field, value) => {
                const today = getLocalDateString(new Date());
                const updatedLogs = {
                    ...dailyLogs,
                    [today]: { ...dailyLogs[today], date: today, [field]: value }
                };
                setDailyLogs(updatedLogs);
                saveData(undefined, updatedLogs, undefined);
            };
            
            const handleAddPiece = (semesterId, eraId, data) => {
                const updated = semesters.map(s => 
                    s.id === semesterId ? {...s, eras: {...s.eras, [eraId]: [...s.eras[eraId], {...data, id: Date.now()}]}} : s
                );
                setSemesters(updated);
                saveData(updated, undefined, undefined);
            };
            
            const handleDeletePiece = (semesterId, eraId, pieceId) => {
                 const updated = semesters.map(s => 
                    s.id === semesterId ? {...s, eras: {...s.eras, [eraId]: s.eras[eraId].filter(x => x.id !== pieceId)}} : s
                 );
                 setSemesters(updated);
                 saveData(updated, undefined, undefined);
            };

            const exportData = () => {
                const data = { semesters, dailyLogs };
                const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `piano_ai_backup_${getLocalDateString(new Date())}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const importData = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.semesters) {
                            setSemesters(data.semesters);
                            saveData(data.semesters, undefined, undefined);
                        }
                        if (data.dailyLogs) {
                            setDailyLogs(data.dailyLogs);
                            saveData(undefined, data.dailyLogs, undefined);
                        }
                        alert("資料還原成功！");
                    } catch (err) { alert("檔案格式錯誤"); }
                };
                reader.readAsText(file);
            };

            // Metronome logic (Enhanced)
            const scheduler = () => {
                while (nextNoteTimeRef.current < audioCtxRef.current.currentTime + 0.1) {
                    const currentBpm = bpmRef.current;
                    const currentTimeSignature = timeSignatureRef.current;
                    const beatTime = nextNoteTimeRef.current;
                    const currentBeatIndex = beatCountRef.current % currentTimeSignature;

                    // Schedule visual update
                    // We use setTimeout to trigger the state change near the actual audio time
                    const timeUntilNote = Math.max(0, (beatTime - audioCtxRef.current.currentTime) * 1000);
                    setTimeout(() => {
                        setActiveBeat(currentBeatIndex);
                    }, timeUntilNote);

                    // Audio
                    if (!isMutedRef.current) {
                        const osc = audioCtxRef.current.createOscillator();
                        const gainNode = audioCtxRef.current.createGain();
                        osc.connect(gainNode);
                        gainNode.connect(audioCtxRef.current.destination);
                        
                        if (currentBeatIndex === 0) {
                            osc.frequency.value = 1600; // Downbeat
                            gainNode.gain.value = 1;
                        } else {
                            osc.frequency.value = 1000; // Other beats
                            gainNode.gain.value = 0.8;
                        }
                        
                        osc.start(beatTime);
                        osc.stop(beatTime + 0.05);
                    }

                    nextNoteTimeRef.current += 60.0 / currentBpm;
                    beatCountRef.current++;
                }
                timerIDRef.current = window.setTimeout(scheduler, 25.0);
            };

            const toggleMetronome = () => {
                if (metronomeOn) {
                    window.clearTimeout(timerIDRef.current);
                    setMetronomeOn(false);
                    setActiveBeat(-1);
                    beatCountRef.current = 0;
                } else {
                    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
                    nextNoteTimeRef.current = audioCtxRef.current.currentTime + 0.05;
                    beatCountRef.current = 0;
                    scheduler();
                    setMetronomeOn(true);
                }
            };

            useEffect(() => {
                // Ensure audio context time is adjusted if needed, usually mostly automatic
                // But we need to ensure refs are fresh if used in loops
            }, [bpm, timeSignature]); // bpm and timeSignature are now refs used in loop

            useEffect(() => () => { if (timerIDRef.current) window.clearTimeout(timerIDRef.current); }, []);

            const isTaskCompleted = (taskId) => {
                const today = getLocalDateString(new Date());
                return !!dailyLogs[today]?.[taskId];
            };

            const calculateDaysRemaining = (targetDate) => {
                if (!targetDate) return 0;
                const diff = new Date(targetDate) - new Date();
                const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                return days > 0 ? days : 0;
            };

            const calculateDailyMeasures = (total, targetDate) => {
                const days = calculateDaysRemaining(targetDate);
                if (days <= 0) return "Expired";
                return Math.ceil(total / days);
            };

            const getCalendarDays = () => {
                const year = viewDate.getFullYear();
                const month = viewDate.getMonth();
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                return { year, month, firstDay, daysInMonth };
            };

            const renderCalendarDetails = () => {
                const dateStr = getLocalDateString(viewDate);
                const log = dailyLogs[dateStr] || {};
                let displayScales;
                if (log.customScale) displayScales = { ...log.customScale, isCustom: true };
                else displayScales = getScalesForDate(viewDate);

                const completedPieces = [];
                semesters.forEach(sem => {
                    Object.values(sem.eras).flat().forEach(piece => {
                        if (log[`piece_${piece.id}`]) completedPieces.push(piece);
                    });
                });

                return (
                    <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-5 animate-slideUp">
                        <div className="flex justify-between items-start mb-4 border-b pb-3">
                            <div>
                                <h3 className="text-xl font-bold text-slate-800">{viewDate.getMonth() + 1}月{viewDate.getDate()}日 紀錄</h3>
                                <p className="text-xs text-slate-400 font-mono mt-1">{dateStr}</p>
                            </div>
                            <div className="text-right">
                                <div className="text-sm font-bold text-indigo-600">完成度</div>
                                <div className="text-2xl font-black text-slate-800">
                                    {log.scales_done ? (completedPieces.length > 0 ? "Excellent" : "Good") : (completedPieces.length > 0 ? "Good" : "-")}
                                </div>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                            <div className="bg-slate-50 p-3 rounded-xl">
                                <div className="text-[10px] text-slate-400 font-bold mb-1">SCALE (音階)</div>
                                <div className="font-bold text-slate-700">{displayScales.major}</div>
                                <div className="text-xs text-slate-500">{displayScales.minor}</div>
                                {log.scales_done && <div className="mt-2 text-xs text-emerald-600 font-bold flex items-center gap-1"><CheckCircle size={12}/> 已完成</div>}
                                {displayScales.isCustom && <div className="mt-1 text-[10px] text-indigo-400">自選調性</div>}
                            </div>
                            <div className="bg-slate-50 p-3 rounded-xl">
                                <div className="text-[10px] text-slate-400 font-bold mb-1">SPEED (速度)</div>
                                <div className="font-bold text-slate-700">{log.achievedSpeed ? `${log.achievedSpeed} BPM` : '-'}</div>
                                <div className="text-xs text-slate-400 mt-1">Target: {log.targetSpeed || 126}</div>
                            </div>
                        </div>
                        {log.focus && (
                            <div className="mb-4">
                                <div className="text-xs font-bold text-slate-400 mb-1">筆記 / 重點</div>
                                <div className="bg-amber-50 text-amber-900 p-3 rounded-xl text-sm border border-amber-100">{log.focus}</div>
                            </div>
                        )}
                        <div>
                            <div className="text-xs font-bold text-slate-400 mb-2">完成曲目 ({completedPieces.length})</div>
                            {completedPieces.length > 0 ? (
                                <div className="space-y-2">
                                    {completedPieces.map(p => (
                                        <div key={p.id} className="flex items-center gap-2 text-sm text-slate-700 bg-slate-50 p-2 rounded-lg">
                                            <CheckCircle size={14} className="text-emerald-500"/>
                                            <span className="truncate">{p.title}</span>
                                        </div>
                                    ))}
                                </div>
                            ) : <div className="text-sm text-slate-300 italic">無練習曲目紀錄</div>}
                        </div>
                    </div>
                );
            };
            
            const dailyQuote = MOTIVATIONAL_QUOTES[getDayOfYear(new Date()) % MOTIVATIONAL_QUOTES.length];

            return (
                <div className="min-h-screen pb-24 bg-gradient-to-br from-slate-50 to-slate-100">
                    <header className="glass-panel sticky top-0 z-30 px-4 py-3 shadow-sm mb-6">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 ai-gradient rounded-xl flex items-center justify-center text-white shadow-lg relative">
                                    <Bot size={20} />
                                    {user && <div className={`absolute -bottom-1 -right-1 w-3 h-3 border-2 border-white rounded-full ${syncId ? 'bg-purple-500' : 'bg-green-400'}`}></div>}
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold text-slate-900 leading-tight">Piano Tracker</h1>
                                    <div className="flex items-center gap-1">
                                        <p className="text-[10px] font-bold text-indigo-600 tracking-wider uppercase bg-indigo-50 px-1 rounded">Pro AI</p>
                                        {isSyncing && <Loader2 size={10} className="text-slate-400 animate-spin" />}
                                    </div>
                                </div>
                            </div>
                            <nav className="flex bg-slate-100/80 p-1 rounded-xl">
                                {[{id:'daily', icon:CheckSquare, label:'今日'}, {id:'plan', icon:BookOpen, label:'曲目'}, {id:'calendar', icon:CalendarIcon, label:'紀錄'}, {id:'ai', icon:Sparkles, label:'AI百科'}, {id:'settings', icon:Settings, label:'設定'}].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === tab.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}>
                                        <tab.icon size={16} />
                                        <span className="hidden md:inline">{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 animate-slideUp">
                        {activeTab === 'daily' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-800">早安，開始練習吧！</h2>
                                        <p className="text-slate-500 text-sm">{new Date().toLocaleDateString('zh-TW', {month:'long', day:'numeric', weekday:'long'})}</p>
                                    </div>
                                    <div className={`px-3 py-1 rounded-full text-xs font-bold border flex items-center gap-1 ${syncId ? 'bg-purple-50 text-purple-600 border-purple-200' : (user ? 'bg-indigo-50 text-indigo-600 border-indigo-100' : 'bg-slate-100 text-slate-500 border-slate-200')}`}>
                                        {user ? <Cloud size={12}/> : (firebaseError ? <AlertCircle size={12}/> : <CloudOff size={12}/>)}
                                        {user ? (syncId ? `已連線` : '本機模式') : '離線'}
                                    </div>
                                </div>
                                
                                {/* Daily Motivational Quote Section */}
                                <div className="bg-gradient-to-br from-indigo-500 to-purple-600 p-6 rounded-2xl shadow-lg relative overflow-hidden text-white">
                                    <div className="absolute -top-4 -right-4 text-white opacity-10 transform rotate-12">
                                        <Quote size={100} fill="currentColor" />
                                    </div>
                                    <div className="flex items-center gap-2 mb-3 font-bold text-indigo-100 opacity-90">
                                        <Sparkles size={18} className="text-yellow-300" />
                                        <h3 className="tracking-widest uppercase text-xs">Daily Motivation</h3>
                                    </div>
                                    <div className="relative z-10">
                                        <p className="text-xl md:text-2xl font-bold leading-relaxed font-serif-tc tracking-wide">
                                            "{dailyQuote}"
                                        </p>
                                        <div className="mt-3 w-12 h-1 bg-yellow-400/80 rounded-full"></div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl border border-indigo-100 shadow-md p-5 relative overflow-hidden">
                                    {showScaleSelector && (
                                        <div className="absolute inset-0 bg-white/95 z-20 flex flex-col p-4 animate-slideUp">
                                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold">選擇調性</h3><button onClick={() => setShowScaleSelector(false)}><X size={20}/></button></div>
                                            <div className="grid grid-cols-3 gap-2 overflow-y-auto pb-4">{MAJOR_SCALES.map((scale, idx) => (<button key={scale} onClick={() => handleSelectScale(idx)} className="text-xs bg-slate-50 border p-2 rounded-lg hover:bg-indigo-50 hover:border-indigo-300 font-bold text-slate-700 transition">{scale}</button>))}</div>
                                        </div>
                                    )}
                                    <div className="flex justify-between items-start mb-4">
                                        <div className="flex gap-4 items-center">
                                            <button onClick={() => updateDailyLog('scales_done', !isTaskCompleted('scales_done'))}>{isTaskCompleted('scales_done') ? <CheckCircle className="text-emerald-500 w-8 h-8" /> : <div className="w-8 h-8 rounded-full border-2 border-slate-300" />}</button>
                                            <div><h3 className="text-lg font-bold text-slate-800">音階暖身</h3>{currentScale.isCustom ? <span className="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold">自選模式</span> : <span className="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded font-bold">每日預設</span>}</div>
                                        </div>
                                        <div className="flex gap-1">
                                            {currentScale.isCustom && <button onClick={handleResetScale} className="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100" title="回到預設"><RefreshCw size={16}/></button>}
                                            <button onClick={() => setShowScaleSelector(true)} className="p-2 text-indigo-600 bg-indigo-50 rounded-full hover:bg-indigo-100 transition" title="選擇調性"><List size={16}/></button>
                                            <button onClick={handleRandomScale} className="p-2 text-white bg-indigo-600 rounded-full hover:bg-indigo-700 transition shadow" title="隨機調性"><Shuffle size={16}/></button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 mb-6">
                                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><div className="text-[10px] text-slate-400 font-bold">MAJOR</div><div className="font-bold text-slate-700">{currentScale.major}</div></div>
                                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><div className="text-[10px] text-slate-400 font-bold">MINOR</div><div className="font-bold text-slate-700">{currentScale.minor}</div></div>
                                    </div>
                                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 relative">
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="font-bold text-slate-600 flex gap-2"><Activity size={18}/>節拍器</div>
                                            <div className="flex bg-white rounded-lg border p-1">{[4, 3, 2, 6].map(sig => (<button key={sig} onClick={() => setTimeSignature(sig)} className={`text-[10px] font-bold px-2 py-0.5 rounded ${timeSignature === sig ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>{sig === 6 ? '6/8' : `${sig}/4`}</button>))}</div>
                                        </div>
                                        
                                        {/* Visual Beats Display */}
                                        <div className="flex justify-center gap-2 mb-4 h-4">
                                            {Array.from({ length: timeSignature === 6 ? 6 : timeSignature }).map((_, i) => (
                                                <div 
                                                    key={i} 
                                                    className={`w-3 h-3 rounded-full transition-all duration-75 ${
                                                        activeBeat === i 
                                                            ? (i === 0 ? 'bg-rose-500 scale-125 shadow-md' : 'bg-indigo-500 scale-110') 
                                                            : 'bg-slate-200'
                                                    }`}
                                                />
                                            ))}
                                        </div>

                                        <div className="flex gap-4 items-center">
                                            <button onClick={toggleMetronome} className={`w-14 h-14 flex-shrink-0 rounded-full flex items-center justify-center transition-all ${metronomeOn ? 'bg-indigo-600 text-white shadow-lg scale-105' : 'bg-white border shadow-sm'}`}>{metronomeOn ? <Pause size={24}/> : <Play size={24} className="ml-1"/>}</button>
                                            <div className="flex-1">
                                                <div className="bg-white border rounded-lg p-2 flex justify-between items-center mb-2">
                                                    <button onClick={() => setBpm(b=>Math.max(40, b-1))} className="p-2 hover:bg-slate-50 rounded"><Minus size={16}/></button>
                                                    <div className="text-center"><div className="font-black text-3xl leading-none text-slate-800">{bpm}</div><div className="text-[10px] font-bold text-slate-400">BPM</div></div>
                                                    <button onClick={() => setBpm(b=>Math.min(208, b+1))} className="p-2 hover:bg-slate-50 rounded"><Plus size={16}/></button>
                                                </div>
                                            </div>
                                            <button onClick={() => setIsMuted(!isMuted)} className={`p-3 rounded-xl transition ${isMuted ? 'bg-rose-100 text-rose-500' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                                                {isMuted ? <VolumeX size={20}/> : <Volume2 size={20}/>}
                                            </button>
                                        </div>
                                        <input type="range" min="40" max="208" value={bpm} onChange={(e)=>setBpm(Number(e.target.value))} className="w-full mt-2 accent-indigo-600"/>
                                        <div className="flex items-center gap-2 mt-4 pt-3 border-t border-slate-200/60">
                                            <span className="text-xs font-bold text-slate-500">目標達成:</span>
                                            <input type="number" className="w-16 bg-white border rounded px-2 py-1 text-center font-bold text-indigo-600" value={dailyLogs[getLocalDateString(new Date())]?.achievedSpeed || ''} onChange={(e)=>updateDailyLog('achievedSpeed', e.target.value)} placeholder="-"/>
                                            <button onClick={()=>updateDailyLog('achievedSpeed', bpm)} className="ml-auto text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg font-bold flex gap-1 transition"><Save size={14}/> 紀錄當前速度</button>
                                        </div>
                                    </div>
                                </div>
                                {semesters.flatMap(sem => Object.entries(sem.eras).flatMap(([key, pieces]) => pieces.map(piece => {
                                    const taskId = `piece_${piece.id}`;
                                    const isDone = isTaskCompleted(taskId);
                                    const dailyGoal = calculateDailyMeasures(piece.measures, piece.targetDate);
                                    const daysLeft = calculateDaysRemaining(piece.targetDate);
                                    return (
                                        <div key={piece.id} className={`bg-white p-5 rounded-2xl border transition-all ${isDone ? 'opacity-60 grayscale' : 'shadow-sm hover:border-indigo-300'}`}>
                                            <div className="flex gap-4">
                                                <button onClick={() => updateDailyLog(taskId, !isDone)} className="mt-1 flex-shrink-0">
                                                    {isDone ? <CheckCircle className="text-emerald-500 w-6 h-6" /> : <div className="w-6 h-6 rounded-full border-2 border-slate-300" />}
                                                </button>
                                                <div className="flex-1">
                                                    <div className="flex justify-between items-start">
                                                        <div><div className={`text-[10px] font-bold px-2 py-0.5 rounded inline-block mb-1 ${ERAS.find(e=>e.id===key).color}`}>{ERAS.find(e=>e.id===key).name.split(' ')[0]}</div><h4 className="font-bold text-lg">{piece.title}</h4><p className="text-sm text-slate-500">{piece.movement}</p></div>
                                                        <div className="text-right"><div className="text-2xl font-bold text-indigo-600">{dailyGoal}</div><div className="text-[10px] text-slate-400">m/day</div></div>
                                                    </div>
                                                    <div className="flex justify-between mt-4 text-xs text-slate-400">
                                                        <div className="flex gap-1 items-center"><Clock size={12}/>{daysLeft} days left</div>
                                                        <div className="flex gap-2 items-center"><button onClick={() => handleExtendDeadline(sem.id, key, piece.id)} className="flex items-center gap-1 text-orange-400 hover:text-orange-600 transition font-bold" title="補救：延後一天"><LifeBuoy size={12}/> <span className="text-[10px]">補救</span></button><span>Total: {piece.measures} m.</span></div>
                                                    </div>
                                                    <ProgressBar current={dailyGoal} total={50} colorClass={daysLeft < 7 ? "bg-rose-500" : "bg-indigo-500"}/>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })))}
                            </div>
                        )}

                        {activeTab === 'plan' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center"><h2 className="text-2xl font-bold text-slate-900">曲目規劃</h2><button onClick={() => setIsSemesterModalOpen(true)} className="flex gap-2 bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg active:scale-95 transition"><Plus size={16}/> 新增學期</button></div>
                                {semesters.map(semester => (
                                    <div key={semester.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="bg-slate-50 px-5 py-4 border-b flex justify-between items-center"><h3 className="font-bold text-lg">{semester.name}</h3><button onClick={() => handleDeleteSemester(semester.id)} className="text-slate-300 hover:text-rose-500"><Trash2 size={18}/></button></div>
                                        <div className="p-5 grid gap-4">{ERAS.map(era => (
                                            <div key={era.id} className="border rounded-xl overflow-hidden">
                                                <div className={`px-4 py-3 flex justify-between items-center ${era.color}`}><span className="font-bold text-sm">{era.name}</span><AddPieceButton onAdd={(data) => handleAddPiece(semester.id, era.id, data)} /></div>
                                                <div className="bg-slate-50 p-3 space-y-2">{semester.eras[era.id].length === 0 ? <div className="text-center text-xs text-slate-300 py-4">無曲目</div> : semester.eras[era.id].map(p => (<div key={p.id} className="bg-white p-3 rounded-lg border flex justify-between items-center group relative"><div><div className="font-bold text-sm">{p.title}</div><div className="text-xs text-slate-500">{p.movement}</div></div><button onClick={() => handleDeletePiece(semester.id, era.id, p.id)} className="text-slate-300 hover:text-rose-500"><Trash2 size={14}/></button></div>))}</div>
                                            </div>
                                        ))}</div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'calendar' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center"><h2 className="text-2xl font-bold">練琴日曆</h2></div>
                                <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
                                    <div className="grid grid-cols-7 gap-2 mb-4 text-center">{['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => <div key={d} className="text-[10px] font-bold text-slate-400 tracking-wider">{d}</div>)}</div>
                                    <div className="grid grid-cols-7 gap-2 md:gap-3">
                                        {(() => {
                                            const { year, month, firstDay, daysInMonth } = getCalendarDays();
                                            const cells = [];
                                            for (let i = 0; i < firstDay; i++) { cells.push(<div key={`empty-${i}`} className="h-10 md:h-14"></div>); }
                                            for (let day = 1; day <= daysInMonth; day++) {
                                                const currentDate = new Date(year, month, day);
                                                const dateStr = getLocalDateString(currentDate);
                                                const log = dailyLogs[dateStr];
                                                const isDone = log && log.scales_done;
                                                const isToday = day === new Date().getDate() && month === new Date().getMonth();
                                                const isSelected = viewDate.getDate() === day && viewDate.getMonth() === month;
                                                cells.push(<div key={day} onClick={() => setViewDate(currentDate)} className={`h-10 md:h-14 rounded-xl border flex flex-col items-center justify-center relative cursor-pointer transition-all active:scale-95 ${isSelected ? 'ring-2 ring-indigo-500 z-10' : 'hover:bg-slate-50'} ${isToday ? 'bg-slate-900 text-white hover:bg-slate-800' : 'bg-white text-slate-600'} ${isDone && !isToday ? 'border-emerald-200 bg-emerald-50' : ''}`}><span className="text-xs font-bold">{day}</span>{isDone && <div className={`w-1.5 h-1.5 rounded-full mt-1 ${isToday ? 'bg-emerald-400' : 'bg-emerald-500'}`}></div>}</div>);
                                            }
                                            return cells;
                                        })()}
                                    </div>
                                </div>
                                {renderCalendarDetails()}
                            </div>
                        )}

                        {activeTab === 'ai' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold">AI 音樂百科</h2>
                                <MusicAIAssistant apiKey={userApiKey} />
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-slate-900">設定</h2>
                                
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className={`p-4 border-b ${syncId ? 'bg-purple-50/50' : 'bg-indigo-50/50'}`}>
                                        <h3 className={`font-bold text-sm flex items-center gap-2 ${syncId ? 'text-purple-900' : 'text-indigo-900'}`}>
                                            {syncId ? <LinkIcon size={16}/> : <Smartphone size={16}/>}
                                            {syncId ? '雲端同步模式' : '本機模式'}
                                        </h3>
                                        <p className={`text-[10px] mt-1 ${syncId ? 'text-purple-600/70' : 'text-indigo-600/70'}`}>
                                            {syncId ? '已連線至雲端資料庫，資料將自動同步。' : '目前資料僅儲存於此裝置。'}
                                        </p>
                                    </div>
                                    <div className="p-4 space-y-6">
                                        
                                        {/* Current Sync Status Block */}
                                        {syncId ? (
                                            <div className="bg-purple-50 rounded-xl p-4 border border-purple-100">
                                                <div className="text-xs font-bold text-purple-400 uppercase tracking-wider mb-2">Current Sync ID</div>
                                                <div className="flex items-center justify-between">
                                                    <div className="text-2xl font-black text-purple-700 tracking-wider font-mono">{syncId}</div>
                                                    <button onClick={handleCopyId} className="p-2 bg-white rounded-lg shadow-sm text-purple-600 hover:text-purple-800 transition active:scale-95"><Copy size={18}/></button>
                                                </div>
                                                <div className="mt-3 text-[10px] text-purple-600/80 leading-relaxed">
                                                    請在其他裝置輸入此代碼，即可同步所有練琴紀錄與曲目。
                                                </div>
                                                <button onClick={handleDisconnect} className="mt-4 w-full py-2 bg-white border border-purple-200 text-purple-600 rounded-lg text-xs font-bold flex items-center justify-center gap-2 hover:bg-purple-100 transition">
                                                    <LogOut size={14}/> 解除同步 (回到本機)
                                                </button>
                                            </div>
                                        ) : (
                                            <div className="grid md:grid-cols-2 gap-4">
                                                {/* Option A: Create New */}
                                                <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 flex flex-col h-full">
                                                    <div className="flex-1">
                                                        <div className="w-8 h-8 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-3"><Cloud size={16}/></div>
                                                        <h4 className="font-bold text-slate-800 mb-1">建立雲端同步</h4>
                                                        <p className="text-xs text-slate-500 leading-relaxed">將目前的資料上傳到雲端，並產生一組新的同步碼。</p>
                                                    </div>
                                                    <button onClick={handleCreateSyncId} className="mt-4 w-full py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold shadow-md hover:bg-indigo-700 active:scale-95 transition">
                                                        產生新的同步碼
                                                    </button>
                                                </div>

                                                {/* Option B: Connect Existing */}
                                                <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 flex flex-col h-full">
                                                    <div className="flex-1">
                                                        <div className="w-8 h-8 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-3"><LinkIcon size={16}/></div>
                                                        <h4 className="font-bold text-slate-800 mb-1">連結現有資料</h4>
                                                        <p className="text-xs text-slate-500 leading-relaxed">若您在其他裝置已有同步碼，請輸入以回復資料。</p>
                                                    </div>
                                                    <div className="mt-4 flex gap-2">
                                                        <input 
                                                            type="text" 
                                                            className="flex-1 bg-white border rounded-lg px-2 text-sm font-mono uppercase focus:ring-2 focus:ring-emerald-500 outline-none"
                                                            placeholder="PIANO-XXXXXX"
                                                            value={inputSyncId}
                                                            onChange={(e) => setInputSyncId(e.target.value.toUpperCase())}
                                                        />
                                                        <button onClick={handleConnectSyncId} className="px-3 py-2 bg-emerald-600 text-white rounded-lg text-sm font-bold hover:bg-emerald-700 active:scale-95 transition">
                                                            連結
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <div className="pt-4 border-t border-slate-100 flex items-center gap-3">
                                            <div className={`w-2 h-2 rounded-full ${user ? 'bg-emerald-500' : 'bg-slate-300'}`}></div>
                                            <div className="flex-1">
                                                <div className="text-xs font-bold text-slate-400">System Status</div>
                                                <div className="text-[10px] text-slate-500">
                                                    {user ? (isSyncing ? 'Syncing...' : 'System Ready') : (firebaseError ? 'Connection Error' : 'Offline Mode')}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-4 border-b bg-indigo-50/50">
                                        <h3 className="font-bold text-indigo-900 text-sm flex items-center gap-2"><KeyRound size={16}/> API 設定</h3>
                                        <p className="text-[10px] text-indigo-600/70 mt-1">若要使用 AI 查詢功能，請在此輸入您的 Gemini API Key。</p>
                                    </div>
                                    <div className="p-4">
                                        <div className="flex gap-2">
                                            <input 
                                                type="password" 
                                                className="flex-1 bg-slate-50 border rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                placeholder="輸入您的 Gemini API Key..."
                                                value={userApiKey}
                                                onChange={(e) => setUserApiKey(e.target.value)}
                                            />
                                            <button onClick={() => handleSaveApiKey(userApiKey)} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold hover:bg-indigo-700 transition">儲存</button>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="p-4 border-b bg-slate-50">
                                        <h3 className="font-bold text-slate-800 text-sm">手動備份</h3>
                                        <p className="text-[10px] text-slate-500 mt-1">建議定期下載 JSON 備份以防萬一。</p>
                                    </div>
                                    <div className="divide-y">
                                        <button onClick={exportData} className="w-full flex items-center justify-between p-4 hover:bg-slate-50 transition text-left group">
                                            <div className="flex items-center gap-3"><div className="bg-indigo-100 text-indigo-600 p-2 rounded-lg"><FileDown size={18}/></div><div><div className="font-bold text-slate-800 text-sm">下載備份檔案</div><div className="text-[10px] text-slate-400">Export JSON</div></div></div><ChevronRight className="text-slate-300 group-hover:text-indigo-500 transition" size={16}/>
                                        </button>
                                        <label className="w-full flex items-center justify-between p-4 hover:bg-slate-50 transition text-left cursor-pointer group">
                                            <div className="flex items-center gap-3"><div className="bg-emerald-100 text-emerald-600 p-2 rounded-lg"><FileUp size={18}/></div><div><div className="font-bold text-slate-800 text-sm">匯入備份檔案</div><div className="text-[10px] text-slate-400">Import JSON</div></div></div><input type="file" accept=".json" onChange={importData} className="hidden" /><ChevronRight className="text-slate-300 group-hover:text-emerald-500 transition" size={16}/>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {isSemesterModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-slideUp">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                                <h3 className="font-bold text-lg mb-4">新增學期</h3>
                                <input className="w-full bg-slate-50 border rounded-xl p-3 mb-6 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="例如: 2026 春季" value={newSemesterName} onChange={e => setNewSemesterName(e.target.value)} autoFocus />
                                <div className="flex gap-3"><button onClick={() => setIsSemesterModalOpen(false)} className="flex-1 py-3 font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition">取消</button><button onClick={handleAddSemester} className="flex-1 py-3 font-bold bg-slate-900 text-white rounded-xl shadow-lg hover:bg-slate-800 transition">建立</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AddPieceButton({ onAdd }) {
            const [isOpen, setIsOpen] = useState(false);
            const [formData, setFormData] = useState({ title: '', movement: '', measures: '', targetDate: '' });
            const handleSubmit = (e) => { e.preventDefault(); if (!formData.title || !formData.measures || !formData.targetDate) return alert("請填寫完整資訊"); onAdd(formData); setFormData({ title: '', movement: '', measures: '', targetDate: '' }); setIsOpen(false); };
            if (!isOpen) return <button onClick={() => setIsOpen(true)} className="w-6 h-6 flex items-center justify-center bg-white/50 hover:bg-white rounded-lg text-slate-600 shadow-sm transition"><Plus size={16} strokeWidth={3}/></button>;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-slideUp">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                        <div className="flex justify-between items-center mb-6"><h3 className="font-bold text-xl text-slate-800">新增曲目</h3><button onClick={() => setIsOpen(false)} className="p-1 bg-slate-100 rounded-full text-slate-400 hover:bg-slate-200"><X size={16}/></button></div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-xs font-bold text-slate-500 mb-1 ml-1">曲名 Title</label><input className="w-full border border-slate-200 bg-slate-50 rounded-xl p-3 text-slate-800 font-medium focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition" placeholder="例如：Sonata No.16" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} autoFocus /></div>
                            <div><label className="block text-xs font-bold text-slate-500 mb-1 ml-1">樂章 Movement (選填)</label><input className="w-full border border-slate-200 bg-slate-50 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition" placeholder="例如：I. Allegro" value={formData.movement} onChange={e => setFormData({...formData, movement: e.target.value})} /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-slate-500 mb-1 ml-1">總小節數 Measures</label><input type="number" className="w-full border border-slate-200 bg-slate-50 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition" placeholder="100" value={formData.measures} onChange={e => setFormData({...formData, measures: e.target.value})} /></div>
                                <div><label className="block text-xs font-bold text-slate-500 mb-1 ml-1">目標日期 Deadline</label><input type="date" className="w-full border border-slate-200 bg-slate-50 rounded-xl p-3 text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition" value={formData.targetDate} onChange={e => setFormData({...formData, targetDate: e.target.value})} /></div>
                            </div>
                            <div className="pt-4"><button type="submit" className="w-full py-3.5 font-bold bg-indigo-600 text-white rounded-xl shadow-lg hover:bg-indigo-700 active:scale-[0.98] transition">確認新增</button></div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<PianoTrackerProAI />);
    </script>
</body>
</html>
