<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="專為鋼琴主修生設計的練琴進度追蹤工具">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>鋼琴練琴大師 Pro</title>
    
    <!-- Favicon (動態生成音符圖示) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎹</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%234f46e5%22/><text x=%2250%22 y=%2250%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2260%22>🎹</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for React translation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for React & Lucide -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .animate-slideUp { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #4f46e5;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 2px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-safe">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Music, Calendar as CalendarIcon, CheckCircle, Clock, Plus, 
            Trash2, Activity, Save, ChevronDown, ChevronRight, BookOpen, 
            ChevronLeft, Award, AlertCircle, CheckSquare, Zap, Target,
            Mic2, Pencil, Sunrise, Play, Pause, Minus, RotateCcw
        } from 'lucide-react';

        // --- Constants ---
        const MAJOR_SCALES = [
            "C 大調 (C Major)", "G 大調 (G Major)", "D 大調 (D Major)", "A 大調 (A Major)", 
            "E 大調 (E Major)", "B 大調 (B Major)", "F# 大調 (F# Major)", "Db 大調 (Db Major)", 
            "Ab 大調 (Ab Major)", "Eb 大調 (Eb Major)", "Bb 大調 (Bb Major)", "F 大調 (F Major)"
        ];

        const MINOR_SCALES = [
            "a 小調 (a Minor)", "e 小調 (e Minor)", "b 小調 (b Minor)", "f# 小調 (f# Minor)", 
            "c# 小調 (c# Minor)", "g# 小調 (g# Minor)", "d# 小調 (d# Minor)", "bb 小調 (bb Minor)", 
            "f 小調 (f Minor)", "c 小調 (c Minor)", "g 小調 (g Minor)", "d 小調 (d Minor)"
        ];

        const ERAS = [
            { id: 'baroque', name: '巴洛克 (Baroque)', color: 'bg-amber-50 text-amber-700 border-amber-200' },
            { id: 'classical', name: '古典 (Classical)', color: 'bg-blue-50 text-blue-700 border-blue-200' },
            { id: 'romantic', name: '浪漫 (Romantic)', color: 'bg-rose-50 text-rose-700 border-rose-200' },
            { id: 'modern', name: '現代 (Modern)', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
        ];

        // Helper to calculate day of year for ANY date
        const getDayOfYear = (date = new Date()) => {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        };

        const getScalesForDate = (date) => {
            const dayIndex = getDayOfYear(date) % MAJOR_SCALES.length;
            return {
                major: MAJOR_SCALES[dayIndex],
                minor: MINOR_SCALES[dayIndex]
            };
        };

        // --- Components ---

        // 1. Progress Bar Component
        const ProgressBar = ({ current, total, colorClass = "bg-indigo-500" }) => {
            const percentage = Math.min(100, Math.max(0, (current / total) * 100));
            return (
                <div className="h-2 w-full bg-slate-100 rounded-full overflow-hidden mt-2">
                    <div 
                        className={`h-full transition-all duration-500 ease-out ${colorClass}`} 
                        style={{ width: `${percentage}%` }}
                    />
                </div>
            );
        };

        // --- Main Application ---
        function PianoPracticeTracker() {
            const [activeTab, setActiveTab] = useState('daily');
            const [semesters, setSemesters] = useState([]);
            const [dailyLogs, setDailyLogs] = useState({});
            const [todayScales, setTodayScales] = useState({ major: "", minor: "" });

            // Metronome State
            const [metronomeOn, setMetronomeOn] = useState(false);
            const [bpm, setBpm] = useState(126);
            const audioCtxRef = useRef(null);
            const nextNoteTimeRef = useRef(0.0);
            const timerIDRef = useRef(null);
            const lookahead = 25.0; 
            const scheduleAheadTime = 0.1; 

            // Modal States
            const [isSemesterModalOpen, setIsSemesterModalOpen] = useState(false);
            const [newSemesterName, setNewSemesterName] = useState("");
            const [semesterToDelete, setSemesterToDelete] = useState(null);

            // Initialize
            useEffect(() => {
                const savedSemesters = localStorage.getItem('piano_semesters_pro');
                const savedLogs = localStorage.getItem('piano_logs_pro');
                
                if (savedSemesters) setSemesters(JSON.parse(savedSemesters));
                else {
                    setSemesters([{
                        id: Date.now(),
                        name: '2025 第一學期',
                        eras: { baroque: [], classical: [], romantic: [], modern: [] }
                    }]);
                }

                let loadedLogs = {};
                if (savedLogs) {
                    loadedLogs = JSON.parse(savedLogs);
                }

                const today = new Date().toISOString().split('T')[0];
                const scales = getScalesForDate(new Date());
                
                setTodayScales(scales);

                setDailyLogs(prev => {
                    const mergedLogs = { ...loadedLogs, ...prev };
                    if (!mergedLogs[today]) {
                        mergedLogs[today] = {
                            date: today,
                            scales: scales,
                            targetSpeed: 126
                        };
                    } else if (!mergedLogs[today].targetSpeed) {
                        mergedLogs[today] = {
                            ...mergedLogs[today],
                            targetSpeed: 126
                        };
                    }
                    // Sync metronome to saved target speed
                    setBpm(mergedLogs[today].targetSpeed || 126);
                    return mergedLogs;
                });

            }, []);

            // Persistence
            useEffect(() => {
                if (semesters.length > 0) localStorage.setItem('piano_semesters_pro', JSON.stringify(semesters));
            }, [semesters]);

            useEffect(() => {
                if (Object.keys(dailyLogs).length > 0) localStorage.setItem('piano_logs_pro', JSON.stringify(dailyLogs));
            }, [dailyLogs]);

            // Metronome Logic
            const playClick = () => {
                const osc = audioCtxRef.current.createOscillator();
                const gainNode = audioCtxRef.current.createGain();

                osc.connect(gainNode);
                gainNode.connect(audioCtxRef.current.destination);

                osc.frequency.value = 1200; // Crisper click
                gainNode.gain.value = 1;

                osc.start(nextNoteTimeRef.current);
                osc.stop(nextNoteTimeRef.current + 0.03);
            };

            const scheduler = () => {
                while (nextNoteTimeRef.current < audioCtxRef.current.currentTime + scheduleAheadTime) {
                    playClick();
                    const secondsPerBeat = 60.0 / bpm;
                    nextNoteTimeRef.current += secondsPerBeat;
                }
                timerIDRef.current = window.setTimeout(scheduler, lookahead);
            };

            const toggleMetronome = () => {
                if (metronomeOn) {
                    window.clearTimeout(timerIDRef.current);
                    setMetronomeOn(false);
                } else {
                    if (!audioCtxRef.current) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        audioCtxRef.current = new AudioContext();
                    }
                    if (audioCtxRef.current.state === 'suspended') {
                        audioCtxRef.current.resume();
                    }
                    
                    nextNoteTimeRef.current = audioCtxRef.current.currentTime + 0.05;
                    scheduler();
                    setMetronomeOn(true);
                }
            };

            useEffect(() => {
                return () => {
                    if (timerIDRef.current) window.clearTimeout(timerIDRef.current);
                };
            }, []);
            
            // Handlers
            const handleAddSemester = (e) => {
                e.preventDefault();
                if (newSemesterName.trim()) {
                    setSemesters([...semesters, {
                        id: Date.now(),
                        name: newSemesterName.trim(),
                        eras: { baroque: [], classical: [], romantic: [], modern: [] }
                    }]);
                    setNewSemesterName("");
                    setIsSemesterModalOpen(false);
                }
            };

            const confirmDeleteSemester = () => {
                if (semesterToDelete) {
                    setSemesters(semesters.filter(s => s.id !== semesterToDelete));
                    setSemesterToDelete(null);
                }
            };

            const addPiece = (semesterId, eraId, pieceData) => {
                setSemesters(semesters.map(sem => {
                    if (sem.id === semesterId) {
                        return {
                            ...sem,
                            eras: {
                                ...sem.eras,
                                [eraId]: [...sem.eras[eraId], { ...pieceData, id: Date.now() }]
                            }
                        };
                    }
                    return sem;
                }));
            };

            const removePiece = (semesterId, eraId, pieceId) => {
                setSemesters(semesters.map(sem => {
                    if (sem.id === semesterId) {
                        return {
                            ...sem,
                            eras: {
                                ...sem.eras,
                                [eraId]: sem.eras[eraId].filter(p => p.id !== pieceId)
                            }
                        };
                    }
                    return sem;
                }));
            };

            const updateDailyLog = (field, value) => {
                const today = new Date().toISOString().split('T')[0];
                setDailyLogs(prev => ({
                    ...prev,
                    [today]: {
                        ...prev[today],
                        date: today,
                        scales: todayScales,
                        [field]: value
                    }
                }));
            };

            const recordSpeed = () => {
                updateDailyLog('achievedSpeed', bpm);
            };

            const updatePieceProgress = (taskId) => {
                updateDailyLog(taskId, !isTaskCompleted(taskId));
            };

            const isTaskCompleted = (taskId) => {
                const today = new Date().toISOString().split('T')[0];
                return !!dailyLogs[today]?.[taskId];
            };

            // Helpers
            const calculateDaysRemaining = (targetDate) => {
                if (!targetDate) return 0;
                const today = new Date();
                const target = new Date(targetDate);
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays > 0 ? diffDays : 0;
            };

            const calculateDailyMeasures = (totalMeasures, targetDate) => {
                const days = calculateDaysRemaining(targetDate);
                if (days <= 0) return "Expired";
                const daily = Math.ceil(totalMeasures / days);
                return daily > totalMeasures ? totalMeasures : daily;
            };

            const todayKey = new Date().toISOString().split('T')[0];
            const todayLog = dailyLogs[todayKey] || {};

            return (
                <div className="min-h-screen pb-20 bg-gradient-to-br from-slate-50 to-slate-100">
                    {/* Header */}
                    <header className="glass-panel sticky top-0 z-30 px-4 py-3 shadow-sm mb-6">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-tr from-indigo-600 to-violet-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                                    <Music size={20} strokeWidth={2.5} />
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold text-slate-900 leading-tight">專業練琴大師</h1>
                                    <p className="text-[10px] font-medium text-slate-500 tracking-wider uppercase">Professional Edition</p>
                                </div>
                            </div>
                            
                            <nav className="flex bg-slate-100/80 p-1 rounded-xl">
                                {[
                                    { id: 'daily', icon: CheckSquare, label: '今日' },
                                    { id: 'plan', icon: BookOpen, label: '曲目' },
                                    { id: 'calendar', icon: CalendarIcon, label: '紀錄' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all ${
                                            activeTab === tab.id 
                                            ? 'bg-white text-indigo-600 shadow-sm' 
                                            : 'text-slate-500 hover:text-slate-700'
                                        }`}
                                    >
                                        <tab.icon size={16} />
                                        <span className="hidden md:inline">{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4">
                        {/* Tab Content: Daily */}
                        {activeTab === 'daily' && (
                            <div className="animate-slideUp space-y-6">
                                {/* Welcome & Motivation */}
                                <div className="flex flex-col md:flex-row justify-between items-end md:items-center gap-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-800">早安，開始練習吧！</h2>
                                        <p className="text-slate-500 text-sm">
                                            {new Date().toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'long' })}
                                        </p>
                                    </div>
                                    <div className="flex items-center gap-2 text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full text-xs font-bold border border-indigo-100">
                                        <Zap size={14} className="fill-indigo-600" />
                                        <span>保持專注，質量勝於份量</span>
                                    </div>
                                </div>

                                {/* Daily Focus Input */}
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                    <div className="flex items-center gap-2 mb-2 text-slate-700 font-bold">
                                        <Target size={18} className="text-rose-500" />
                                        <h3>今日練習重點 (Technical Focus)</h3>
                                    </div>
                                    <textarea 
                                        className="w-full bg-slate-50 rounded-xl p-3 text-sm text-slate-700 border-none focus:ring-2 focus:ring-indigo-100 placeholder:text-slate-400 resize-none h-20 transition-all"
                                        placeholder="例如：調整蕭邦練習曲的觸鍵層次、巴哈賦格的聲部清晰度..."
                                        value={todayLog.focus || ''}
                                        onChange={(e) => updateDailyLog('focus', e.target.value)}
                                    ></textarea>
                                </div>

                                {/* Scale Warmup with Metronome */}
                                <div className={`relative overflow-hidden transition-all duration-300 rounded-2xl border ${isTaskCompleted('scales_done') ? 'bg-slate-50 border-slate-200' : 'bg-white border-indigo-100 shadow-md shadow-indigo-50'}`}>
                                    {isTaskCompleted('scales_done') && <div className="absolute inset-0 bg-slate-100/50 z-10 pointer-events-none" />}
                                    <div className="p-5">
                                        {/* Scale Title & Checkbox */}
                                        <div className="flex gap-4 items-center mb-4 z-20 relative">
                                            <button 
                                                onClick={() => updateDailyLog('scales_done', !isTaskCompleted('scales_done'))}
                                                className="flex-shrink-0"
                                            >
                                                {isTaskCompleted('scales_done') ? 
                                                    <CheckCircle className="text-emerald-500 w-8 h-8 drop-shadow-sm" /> : 
                                                    <div className="w-8 h-8 rounded-full border-2 border-slate-300 hover:border-indigo-500 hover:scale-105 transition-all bg-white" />
                                                }
                                            </button>
                                            
                                            <div className="flex-1">
                                                <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                                    音階與琶音暖身
                                                    {!isTaskCompleted('scales_done') && <span className="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full">Required</span>}
                                                </h3>
                                            </div>
                                        </div>

                                        {/* Scale Keys Display */}
                                        <div className="grid grid-cols-2 gap-3 mb-6 relative z-20">
                                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Major</div>
                                                <div className="font-semibold text-slate-700">{todayScales.major}</div>
                                            </div>
                                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Minor</div>
                                                <div className="font-semibold text-slate-700">{todayScales.minor}</div>
                                            </div>
                                        </div>

                                        {/* Metronome & Speed Recording */}
                                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 relative z-20">
                                            <div className="flex items-center justify-between mb-4">
                                                <div className="flex items-center gap-2 text-slate-600 font-bold">
                                                    <Activity size={18} />
                                                    <span>節拍器 & 速度紀錄</span>
                                                </div>
                                                <div className="text-xs bg-white px-2 py-1 rounded border border-slate-200 font-mono">
                                                    Target: {todayLog.targetSpeed || 126} BPM
                                                </div>
                                            </div>

                                            {/* Metronome Controls */}
                                            <div className="flex flex-col gap-4">
                                                <div className="flex items-center justify-between gap-4">
                                                    <button 
                                                        onClick={toggleMetronome}
                                                        className={`w-12 h-12 rounded-full flex items-center justify-center shadow-sm transition-all ${metronomeOn ? 'bg-indigo-600 text-white shadow-indigo-200' : 'bg-white text-slate-700 border border-slate-200 hover:border-indigo-300'}`}
                                                    >
                                                        {metronomeOn ? <Pause size={20} fill="currentColor" /> : <Play size={20} fill="currentColor" className="ml-1"/>}
                                                    </button>
                                                    
                                                    <div className="flex-1 bg-white rounded-lg border border-slate-200 p-2 flex items-center justify-between">
                                                        <button onClick={() => setBpm(b => Math.max(40, b - 1))} className="p-1 hover:bg-slate-100 rounded"><Minus size={16}/></button>
                                                        <div className="flex flex-col items-center">
                                                            <span className="text-2xl font-black text-slate-800 leading-none">{bpm}</span>
                                                            <span className="text-[10px] text-slate-400 uppercase font-bold">BPM</span>
                                                        </div>
                                                        <button onClick={() => setBpm(b => Math.min(240, b + 1))} className="p-1 hover:bg-slate-100 rounded"><Plus size={16}/></button>
                                                    </div>
                                                </div>

                                                <input 
                                                    type="range" 
                                                    min="40" 
                                                    max="208" 
                                                    value={bpm} 
                                                    onChange={(e) => setBpm(Number(e.target.value))}
                                                    className="w-full accent-indigo-600"
                                                />

                                                {/* Record Result Area */}
                                                <div className="flex items-center gap-2 pt-2 border-t border-slate-200 mt-1">
                                                    <span className="text-xs font-bold text-slate-500">達成速度:</span>
                                                    <input 
                                                        type="number" 
                                                        placeholder="0"
                                                        className="w-16 bg-white border border-slate-200 rounded px-2 py-1 text-center font-bold text-indigo-600 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                                        value={todayLog.achievedSpeed || ''}
                                                        onChange={(e) => updateDailyLog('achievedSpeed', e.target.value)}
                                                    />
                                                    <span className="text-xs text-slate-400 mr-auto">BPM</span>
                                                    
                                                    <button 
                                                        onClick={recordSpeed}
                                                        className="text-xs flex items-center gap-1 bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg hover:bg-indigo-200 transition font-bold"
                                                        title="將當前節拍器速度紀錄為達成速度"
                                                    >
                                                        <Save size={14} /> 紀錄當前速度
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Repertoire List */}
                                <div className="space-y-4">
                                    <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest pl-1">Repertoire</h3>
                                    
                                    {semesters.length === 0 ? (
                                        <div className="text-center py-12 bg-white rounded-2xl border-2 border-dashed border-slate-200">
                                            <p className="text-slate-400 mb-2">尚未建立曲目</p>
                                            <button onClick={() => setActiveTab('plan')} className="text-indigo-600 font-bold text-sm hover:underline">去新增曲目</button>
                                        </div>
                                    ) : (
                                        semesters.flatMap(sem => 
                                            Object.entries(sem.eras).flatMap(([eraKey, pieces]) => 
                                                pieces.map(piece => {
                                                    const taskId = `piece_${piece.id}`;
                                                    const isDone = isTaskCompleted(taskId);
                                                    const dailyGoal = calculateDailyMeasures(piece.measures, piece.targetDate);
                                                    const daysLeft = calculateDaysRemaining(piece.targetDate);
                                                    
                                                    return (
                                                        <div key={piece.id} className={`group relative bg-white p-5 rounded-2xl border transition-all duration-300 ${isDone ? 'border-slate-100 opacity-60 grayscale-[0.5]' : 'border-slate-100 hover:border-indigo-300 shadow-sm hover:shadow-md'}`}>
                                                            <div className="flex gap-4">
                                                                <button 
                                                                    onClick={() => updatePieceProgress(taskId)}
                                                                    className="mt-1 flex-shrink-0"
                                                                >
                                                                    {isDone ? 
                                                                        <CheckCircle className="text-indigo-500 w-6 h-6" /> : 
                                                                        <div className="w-6 h-6 rounded-full border-2 border-slate-300 group-hover:border-indigo-500 transition-colors" />
                                                                    }
                                                                </button>

                                                                <div className="flex-1">
                                                                    <div className="flex justify-between items-start mb-1">
                                                                        <div>
                                                                            <h4 className={`font-bold text-slate-800 text-lg mt-1 ${isDone ? 'line-through decoration-slate-300' : ''}`}>
                                                                                {piece.title}
                                                                            </h4>
                                                                            <p className="text-sm text-slate-500 font-medium">{piece.movement}</p>
                                                                        </div>
                                                                        <div className="text-right">
                                                                            <div className="text-2xl font-bold text-indigo-600 leading-none">{dailyGoal}</div>
                                                                            <div className="text-[10px] text-slate-400 font-medium mt-1">measures/day</div>
                                                                        </div>
                                                                    </div>

                                                                    {/* Progress & Stats */}
                                                                    <div className="mt-4 flex items-center justify-between text-xs text-slate-400">
                                                                        <div className="flex items-center gap-2">
                                                                            <Clock size={12} />
                                                                            <span className={daysLeft < 14 ? "text-rose-500 font-bold" : ""}>{daysLeft} days left</span>
                                                                        </div>
                                                                        <div>Total: {piece.measures} m.</div>
                                                                    </div>
                                                                    {/* Simplified visual progress */}
                                                                    <ProgressBar current={dailyGoal} total={50} colorClass={daysLeft < 7 ? "bg-rose-500" : "bg-indigo-500"} />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })
                                            )
                                        )
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Tab Content: Plan */}
                        {activeTab === 'plan' && (
                            <div className="animate-slideUp space-y-8">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-900">曲目規劃</h2>
                                        <p className="text-slate-500 text-sm">管理本學期的演奏會或考試曲目。</p>
                                    </div>
                                    <button 
                                        onClick={() => setIsSemesterModalOpen(true)}
                                        className="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl transition shadow-lg shadow-slate-200 text-sm font-bold"
                                    >
                                        <Plus size={16} /> 新增學期
                                    </button>
                                </div>

                                {semesters.map((semester) => (
                                    <div key={semester.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="bg-slate-50 px-5 py-4 border-b border-slate-200 flex justify-between items-center">
                                            <h3 className="font-bold text-lg text-slate-800">{semester.name}</h3>
                                            <button onClick={() => setSemesterToDelete(semester.id)} className="text-slate-300 hover:text-rose-500 transition p-2 hover:bg-rose-50 rounded-lg">
                                                <Trash2 size={18} />
                                            </button>
                                        </div>

                                        <div className="p-5 grid grid-cols-1 md:grid-cols-2 gap-6">
                                            {ERAS.map((era) => (
                                                <div key={era.id} className="flex flex-col h-full rounded-xl overflow-hidden border border-slate-100">
                                                    <div className={`flex items-center justify-between px-4 py-3 ${era.color}`}>
                                                        <span className="font-bold text-sm">{era.name}</span>
                                                        <AddPieceButton onAdd={(data) => addPiece(semester.id, era.id, data)} />
                                                    </div>
                                                    
                                                    <div className="bg-slate-50/50 p-3 flex-1 min-h-[120px] space-y-2">
                                                        {semester.eras[era.id].length === 0 ? (
                                                            <div className="h-full flex flex-col items-center justify-center text-slate-300 text-xs gap-2">
                                                                <Music size={24} className="opacity-20" />
                                                                <span>尚無曲目</span>
                                                            </div>
                                                        ) : (
                                                            semester.eras[era.id].map(piece => (
                                                                <div key={piece.id} className="bg-white p-3 rounded-lg shadow-sm border border-slate-100 relative group hover:border-indigo-200 transition">
                                                                    <button 
                                                                        onClick={() => removePiece(semester.id, era.id, piece.id)}
                                                                        className="absolute top-2 right-2 text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition p-1"
                                                                    >
                                                                        <Trash2 size={14} />
                                                                    </button>
                                                                    
                                                                    <div className="flex items-center gap-2 mb-1">
                                                                        <div className="font-bold text-slate-800 text-sm truncate pr-6">{piece.title}</div>
                                                                    </div>
                                                                    
                                                                    <div className="text-xs text-slate-500 mb-2 truncate">{piece.movement}</div>
                                                                    
                                                                    <div className="flex justify-between items-end border-t border-slate-50 pt-2 mt-2">
                                                                        <div className="text-[10px] text-slate-400">
                                                                            Target: {piece.targetDate}
                                                                        </div>
                                                                        <div className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">
                                                                            {calculateDailyMeasures(piece.measures, piece.targetDate)} m/day
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            ))
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Tab Content: Calendar */}
                        {activeTab === 'calendar' && (
                            <CalendarView dailyLogs={dailyLogs} semesters={semesters} />
                        )}
                    </main>

                    {/* Modals */}
                    {isSemesterModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-fadeIn">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 transform transition-all scale-100">
                                <h3 className="font-bold text-lg mb-4 text-slate-800">新增學期計畫</h3>
                                <form onSubmit={handleAddSemester}>
                                    <input 
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none mb-6 font-medium placeholder:text-slate-400"
                                        placeholder="例如: 2026 大三上學期"
                                        value={newSemesterName}
                                        onChange={e => setNewSemesterName(e.target.value)}
                                        autoFocus
                                    />
                                    <div className="flex gap-3">
                                        <button type="button" onClick={() => setIsSemesterModalOpen(false)} className="flex-1 py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition">取消</button>
                                        <button type="submit" className="flex-1 py-2.5 text-sm font-bold bg-slate-900 text-white rounded-xl hover:bg-slate-800 shadow-lg shadow-slate-200 transition">建立</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {semesterToDelete && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 animate-fadeIn">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
                                <div className="flex flex-col items-center text-center mb-6">
                                    <div className="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center mb-4">
                                        <AlertCircle size={24} className="text-rose-600" />
                                    </div>
                                    <h3 className="font-bold text-lg text-slate-800">確定刪除此學期?</h3>
                                    <p className="text-slate-500 text-sm mt-2">所有的曲目與設定將會被永久移除。</p>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setSemesterToDelete(null)} className="flex-1 py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition">取消</button>
                                    <button onClick={confirmDeleteSemester} className="flex-1 py-2.5 text-sm font-bold bg-rose-500 text-white rounded-xl hover:bg-rose-600 shadow-lg shadow-rose-200 transition">刪除</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Sub-Components ---
        function CalendarView({ dailyLogs, semesters }) {
            const [currentDate, setCurrentDate] = useState(new Date());

            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const days = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay();
                return { days, firstDay };
            };

            const changeMonth = (delta) => {
                setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + delta, 1));
            };

            const getTaskStatus = (dateStr) => {
                const log = dailyLogs[dateStr];
                if (!log) return null;

                let completed = 0;
                if (log.scales_done) completed++;

                Object.keys(log).forEach(key => {
                    if (key.startsWith('piece_') && log[key] === true) {
                        completed++;
                    }
                });

                let total = 1; // Scales
                const currentPieceCount = semesters.reduce((acc, sem) => {
                    return acc + Object.values(sem.eras).reduce((eAcc, pieces) => eAcc + pieces.length, 0);
                }, 0);
                total += currentPieceCount;

                return { completed, total: Math.max(completed, total) };
            };

            // Calculate tomorrow's scale
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowScales = getScalesForDate(tomorrow);

            const { days, firstDay } = getDaysInMonth(currentDate);
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            return (
                <div className="animate-slideUp space-y-6">
                    <div className="flex justify-between items-center px-2">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-900">練琴日曆</h2>
                            <p className="text-slate-500 text-sm">Consistency is key.</p>
                        </div>
                        <div className="flex items-center gap-2 bg-white px-2 py-1.5 rounded-xl shadow-sm border border-slate-200">
                            <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-slate-50 rounded-lg text-slate-400 hover:text-slate-700 transition"><ChevronLeft size={18}/></button>
                            <span className="font-bold text-slate-800 w-32 text-center text-sm">
                                {monthNames[currentDate.getMonth()]} {currentDate.getFullYear()}
                            </span>
                            <button onClick={() => changeMonth(1)} className="p-2 hover:bg-slate-50 rounded-lg text-slate-400 hover:text-slate-700 transition"><ChevronRight size={18}/></button>
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
                        <div className="grid grid-cols-7 gap-2 mb-4 text-center">
                            {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map(d => (
                                <div key={d} className="text-[10px] font-bold text-slate-400 tracking-wider">{d}</div>
                            ))}
                        </div>
                        <div className="grid grid-cols-7 gap-2 md:gap-3">
                            {Array.from({ length: firstDay }).map((_, i) => (
                                <div key={`empty-${i}`} className="h-14 md:h-24"></div>
                            ))}
                            {Array.from({ length: days }).map((_, i) => {
                                const day = i + 1;
                                const dateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                const status = getTaskStatus(dateStr);
                                const isToday = new Date().toDateString() === new Date(currentDate.getFullYear(), currentDate.getMonth(), day).toDateString();
                                
                                let cellClass = 'bg-white border-slate-100 hover:border-indigo-200';
                                if (isToday) cellClass = 'bg-slate-900 border-slate-900 text-white shadow-lg shadow-slate-300 transform scale-105 z-10';
                                else if (status) {
                                    if (status.completed === status.total && status.total > 0) cellClass = 'bg-emerald-50 border-emerald-100';
                                    else if (status.completed > 0) cellClass = 'bg-amber-50 border-amber-100';
                                }

                                return (
                                    <div 
                                        key={day} 
                                        className={`h-14 md:h-24 rounded-2xl border p-2 relative flex flex-col items-start justify-between transition-all duration-300 ${cellClass}`}
                                    >
                                        <span className={`text-xs font-bold ${isToday ? 'text-white' : 'text-slate-600'}`}>{day}</span>
                                        
                                        {status && (
                                            <div className="w-full flex justify-end">
                                                {status.completed === status.total && status.total > 0 ? (
                                                    <div className={`p-1 rounded-full ${isToday ? 'bg-white/20' : 'bg-emerald-100'}`}>
                                                        <CheckCircle size={14} className={isToday ? "text-white" : "text-emerald-500"} />
                                                    </div>
                                                ) : (
                                                    <div className={`text-[10px] font-bold px-1.5 py-0.5 rounded-md ${isToday ? 'bg-white/20 text-white' : 'bg-white text-slate-500 border border-slate-100'}`}>
                                                        {status.completed}/{status.total}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {/* Tomorrow's Forecast Card */}
                    <div className="bg-gradient-to-r from-violet-500 to-fuchsia-500 rounded-3xl p-6 text-white shadow-lg shadow-fuchsia-200">
                        <div className="flex items-start justify-between">
                            <div>
                                <div className="flex items-center gap-2 mb-2">
                                    <Sunrise size={20} className="text-fuchsia-100" />
                                    <h3 className="font-bold text-lg">明日預告 (Tomorrow's Forecast)</h3>
                                </div>
                                <p className="text-fuchsia-100 text-sm mb-4">
                                    提前準備明天的音階，讓練習更從容。
                                </p>
                                <div className="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/20">
                                    <div className="text-xs font-bold text-fuchsia-100 uppercase mb-1">Scale of Tomorrow</div>
                                    <div className="font-bold text-xl">{tomorrowScales.major}</div>
                                    <div className="text-sm opacity-90">{tomorrowScales.minor}</div>
                                </div>
                            </div>
                            <div className="hidden md:block text-9xl opacity-10 font-serif">
                                {new Date(tomorrow).getDate()}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AddPieceButton({ onAdd }) {
            const [isOpen, setIsOpen] = useState(false);
            const [formData, setFormData] = useState({
                title: '',
                movement: '',
                measures: '',
                targetDate: '',
                instrument: 'piano' // Default
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.title || !formData.measures || !formData.targetDate) {
                    alert("請填寫完整資訊 (曲名、總小節、目標日期)");
                    return;
                }
                onAdd(formData);
                setFormData({ title: '', movement: '', measures: '', targetDate: '', instrument: 'piano' });
                setIsOpen(false);
            };

            if (!isOpen) {
                return (
                    <button 
                        onClick={() => setIsOpen(true)}
                        className="w-6 h-6 flex items-center justify-center bg-white/50 hover:bg-white rounded-lg transition text-slate-600 hover:text-indigo-600"
                        title="新增曲目"
                    >
                        <Plus size={16} strokeWidth={3} />
                    </button>
                );
            }

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 animate-fadeIn">
                        <h3 className="font-bold text-lg mb-4 text-slate-800">新增曲目</h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">曲目名稱</label>
                                <input 
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-medium"
                                    placeholder="例如: Beethoven Sonata No.1"
                                    value={formData.title}
                                    onChange={e => setFormData({...formData, title: e.target.value})}
                                    autoFocus
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">樂章 (選填)</label>
                                <input 
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                    placeholder="例如: 1st Movement"
                                    value={formData.movement}
                                    onChange={e => setFormData({...formData, movement: e.target.value})}
                                />
                            </div>
                            <div className="flex gap-3">
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-slate-500 mb-1">總小節數</label>
                                    <input 
                                        type="number"
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                        placeholder="100"
                                        value={formData.measures}
                                        onChange={e => setFormData({...formData, measures: e.target.value})}
                                    />
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs font-bold text-slate-500 mb-1">預計完成日</label>
                                    <input 
                                        type="date"
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                                        value={formData.targetDate}
                                        onChange={e => setFormData({...formData, targetDate: e.target.value})}
                                    />
                                </div>
                            </div>
                            
                            <div className="flex gap-3 pt-2">
                                <button 
                                    type="button"
                                    onClick={() => setIsOpen(false)}
                                    className="flex-1 py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition"
                                >
                                    取消
                                </button>
                                <button 
                                    type="submit"
                                    className="flex-1 py-2.5 text-sm font-bold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 transition"
                                >
                                    新增
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<PianoPracticeTracker />);
    </script>
</body>
</html>
