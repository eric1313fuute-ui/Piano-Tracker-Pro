<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="專為鋼琴主修生設計的練琴進度追蹤工具">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>鋼琴練琴大師 Pro</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎹</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%234f46e5%22/><text x=%2250%22 y=%2250%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2260%22>🎹</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
    }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .animate-slideUp { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: #4f46e5; cursor: pointer; margin-top: -8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #e2e8f0; border-radius: 2px;
        }
    </style>
</head>
<body class="text-slate-800 antialiased pb-safe">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Music, Calendar as CalendarIcon, CheckCircle, Clock, Plus, 
            Trash2, Activity, Save, ChevronDown, ChevronRight, BookOpen, 
            ChevronLeft, AlertCircle, CheckSquare, Zap, Target,
            Sunrise, Play, Pause, Minus, Download, Upload, Settings
        } from 'lucide-react';

        const MAJOR_SCALES = [ "C 大調", "G 大調", "D 大調", "A 大調", "E 大調", "B 大調", "F# 大調", "Db 大調", "Ab 大調", "Eb 大調", "Bb 大調", "F 大調" ];
        const MINOR_SCALES = [ "a 小調", "e 小調", "b 小調", "f# 小調", "c# 小調", "g# 小調", "d# 小調", "bb 小調", "f 小調", "c 小調", "g 小調", "d 小調" ];
        const ERAS = [
            { id: 'baroque', name: '巴洛克 (Baroque)', color: 'bg-amber-50 text-amber-700 border-amber-200' },
            { id: 'classical', name: '古典 (Classical)', color: 'bg-blue-50 text-blue-700 border-blue-200' },
            { id: 'romantic', name: '浪漫 (Romantic)', color: 'bg-rose-50 text-rose-700 border-rose-200' },
            { id: 'modern', name: '現代 (Modern)', color: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
        ];

        const getDayOfYear = (date = new Date()) => {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        };

        const getScalesForDate = (date) => {
            const dayIndex = getDayOfYear(date) % MAJOR_SCALES.length;
            return { major: MAJOR_SCALES[dayIndex], minor: MINOR_SCALES[dayIndex] };
        };

        const ProgressBar = ({ current, total, colorClass = "bg-indigo-500" }) => {
            const percentage = Math.min(100, Math.max(0, (current / total) * 100));
            return (
                <div className="h-2 w-full bg-slate-100 rounded-full overflow-hidden mt-2">
                    <div className={`h-full transition-all duration-500 ease-out ${colorClass}`} style={{ width: `${percentage}%` }} />
                </div>
            );
        };

        function PianoPracticeTracker() {
            const [activeTab, setActiveTab] = useState('daily');
            const [semesters, setSemesters] = useState([]);
            const [dailyLogs, setDailyLogs] = useState({});
            const [todayScales, setTodayScales] = useState({ major: "", minor: "" });
            const [metronomeOn, setMetronomeOn] = useState(false);
            const [bpm, setBpm] = useState(126);
            const [isSemesterModalOpen, setIsSemesterModalOpen] = useState(false);
            const [newSemesterName, setNewSemesterName] = useState("");
            const [semesterToDelete, setSemesterToDelete] = useState(null);
            
            // Audio Refs
            const audioCtxRef = useRef(null);
            const nextNoteTimeRef = useRef(0.0);
            const timerIDRef = useRef(null);

            useEffect(() => {
                const savedSemesters = localStorage.getItem('piano_semesters_pro');
                const savedLogs = localStorage.getItem('piano_logs_pro');
                
                if (savedSemesters) setSemesters(JSON.parse(savedSemesters));
                else {
                    setSemesters([{
                        id: Date.now(),
                        name: '2025 第一學期',
                        eras: { baroque: [], classical: [], romantic: [], modern: [] }
                    }]);
                }

                let loadedLogs = {};
                if (savedLogs) loadedLogs = JSON.parse(savedLogs);

                const today = new Date().toISOString().split('T')[0];
                const scales = getScalesForDate(new Date());
                setTodayScales(scales);

                setDailyLogs(prev => {
                    const mergedLogs = { ...loadedLogs, ...prev };
                    if (!mergedLogs[today]) {
                        mergedLogs[today] = { date: today, scales: scales, targetSpeed: 126 };
                    }
                    setBpm(mergedLogs[today].targetSpeed || 126);
                    return mergedLogs;
                });
            }, []);

            useEffect(() => {
                if (semesters.length > 0) localStorage.setItem('piano_semesters_pro', JSON.stringify(semesters));
            }, [semesters]);

            useEffect(() => {
                if (Object.keys(dailyLogs).length > 0) localStorage.setItem('piano_logs_pro', JSON.stringify(dailyLogs));
            }, [dailyLogs]);

            // Backup Functions
            const exportData = () => {
                const data = { semesters, dailyLogs };
                const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `piano_backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const importData = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.semesters) setSemesters(data.semesters);
                        if (data.dailyLogs) setDailyLogs(data.dailyLogs);
                        alert("資料還原成功！");
                    } catch (err) {
                        alert("檔案格式錯誤");
                    }
                };
                reader.readAsText(file);
            };

            // Metronome
            const scheduler = () => {
                while (nextNoteTimeRef.current < audioCtxRef.current.currentTime + 0.1) {
                    const osc = audioCtxRef.current.createOscillator();
                    const gainNode = audioCtxRef.current.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(audioCtxRef.current.destination);
                    osc.frequency.value = 1200;
                    gainNode.gain.value = 1;
                    osc.start(nextNoteTimeRef.current);
                    osc.stop(nextNoteTimeRef.current + 0.03);
                    nextNoteTimeRef.current += 60.0 / bpm;
                }
                timerIDRef.current = window.setTimeout(scheduler, 25.0);
            };

            const toggleMetronome = () => {
                if (metronomeOn) {
                    window.clearTimeout(timerIDRef.current);
                    setMetronomeOn(false);
                } else {
                    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
                    nextNoteTimeRef.current = audioCtxRef.current.currentTime + 0.05;
                    scheduler();
                    setMetronomeOn(true);
                }
            };

            useEffect(() => () => { if (timerIDRef.current) window.clearTimeout(timerIDRef.current); }, []);

            // Logic Helpers
            const updateDailyLog = (field, value) => {
                const today = new Date().toISOString().split('T')[0];
                setDailyLogs(prev => ({
                    ...prev,
                    [today]: { ...prev[today], date: today, scales: todayScales, [field]: value }
                }));
            };

            const isTaskCompleted = (taskId) => {
                const today = new Date().toISOString().split('T')[0];
                return !!dailyLogs[today]?.[taskId];
            };

            const calculateDaysRemaining = (targetDate) => {
                if (!targetDate) return 0;
                const diff = new Date(targetDate) - new Date();
                const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                return days > 0 ? days : 0;
            };

            const calculateDailyMeasures = (total, targetDate) => {
                const days = calculateDaysRemaining(targetDate);
                if (days <= 0) return "Expired";
                return Math.ceil(total / days);
            };

            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tomorrowScales = getScalesForDate(tomorrow);

            return (
                <div className="min-h-screen pb-24 bg-gradient-to-br from-slate-50 to-slate-100">
                    <header className="glass-panel sticky top-0 z-30 px-4 py-3 shadow-sm mb-6">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-tr from-indigo-600 to-violet-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                                    <Music size={20} />
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold text-slate-900 leading-tight">專業練琴大師</h1>
                                    <p className="text-[10px] font-medium text-slate-500 tracking-wider uppercase">Pro Edition</p>
                                </div>
                            </div>
                            <nav className="flex bg-slate-100/80 p-1 rounded-xl">
                                {[{id:'daily', icon:CheckSquare, label:'今日'}, {id:'plan', icon:BookOpen, label:'曲目'}, {id:'calendar', icon:CalendarIcon, label:'紀錄'}, {id:'settings', icon:Settings, label:'設定'}].map(tab => (
                                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-bold transition-all ${activeTab === tab.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}>
                                        <tab.icon size={16} />
                                        <span className="hidden md:inline">{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 animate-slideUp">
                        {activeTab === 'daily' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-800">早安，開始練習吧！</h2>
                                        <p className="text-slate-500 text-sm">{new Date().toLocaleDateString('zh-TW', {month:'long', day:'numeric', weekday:'long'})}</p>
                                    </div>
                                    <div className="text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full text-xs font-bold border border-indigo-100">保持專注</div>
                                </div>

                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                                    <div className="flex items-center gap-2 mb-2 text-slate-700 font-bold">
                                        <Target size={18} className="text-rose-500" /><h3>今日練習重點</h3>
                                    </div>
                                    <textarea className="w-full bg-slate-50 rounded-xl p-3 text-sm text-slate-700 border-none h-20 resize-none focus:ring-2 focus:ring-indigo-100" placeholder="例如：觸鍵層次、聲部清晰度..." value={dailyLogs[new Date().toISOString().split('T')[0]]?.focus || ''} onChange={(e) => updateDailyLog('focus', e.target.value)}></textarea>
                                </div>

                                <div className="bg-white rounded-2xl border border-indigo-100 shadow-md p-5">
                                    <div className="flex gap-4 items-center mb-4">
                                        <button onClick={() => updateDailyLog('scales_done', !isTaskCompleted('scales_done'))}>
                                            {isTaskCompleted('scales_done') ? <CheckCircle className="text-emerald-500 w-8 h-8" /> : <div className="w-8 h-8 rounded-full border-2 border-slate-300" />}
                                        </button>
                                        <h3 className="text-lg font-bold text-slate-800">音階暖身</h3>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 mb-6">
                                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><div className="text-[10px] text-slate-400 font-bold">MAJOR</div><div className="font-bold text-slate-700">{todayScales.major}</div></div>
                                        <div className="bg-slate-50 p-3 rounded-xl border border-slate-100"><div className="text-[10px] text-slate-400 font-bold">MINOR</div><div className="font-bold text-slate-700">{todayScales.minor}</div></div>
                                    </div>
                                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="font-bold text-slate-600 flex gap-2"><Activity size={18}/>節拍器</div>
                                            <div className="text-xs font-mono bg-white px-2 py-1 rounded border">Target: {dailyLogs[new Date().toISOString().split('T')[0]]?.targetSpeed || 126}</div>
                                        </div>
                                        <div className="flex gap-4 items-center">
                                            <button onClick={toggleMetronome} className={`w-12 h-12 rounded-full flex items-center justify-center ${metronomeOn ? 'bg-indigo-600 text-white' : 'bg-white border'}`}>
                                                {metronomeOn ? <Pause size={20}/> : <Play size={20} className="ml-1"/>}
                                            </button>
                                            <div className="flex-1 bg-white border rounded-lg p-2 flex justify-between items-center">
                                                <button onClick={() => setBpm(b=>b-1)} className="p-1"><Minus size={16}/></button>
                                                <div className="font-black text-2xl">{bpm} <span className="text-[10px] font-normal text-slate-400">BPM</span></div>
                                                <button onClick={() => setBpm(b=>b+1)} className="p-1"><Plus size={16}/></button>
                                            </div>
                                        </div>
                                        <input type="range" min="40" max="208" value={bpm} onChange={(e)=>setBpm(Number(e.target.value))} className="w-full mt-4 accent-indigo-600"/>
                                        <div className="flex items-center gap-2 mt-4 pt-2 border-t">
                                            <span className="text-xs font-bold text-slate-500">達成:</span>
                                            <input type="number" className="w-16 bg-white border rounded px-2 py-1 text-center font-bold text-indigo-600" value={dailyLogs[new Date().toISOString().split('T')[0]]?.achievedSpeed || ''} onChange={(e)=>updateDailyLog('achievedSpeed', e.target.value)}/>
                                            <button onClick={()=>updateDailyLog('achievedSpeed', bpm)} className="ml-auto text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg font-bold flex gap-1"><Save size={14}/> 紀錄</button>
                                        </div>
                                    </div>
                                </div>

                                {semesters.flatMap(sem => Object.entries(sem.eras).flatMap(([key, pieces]) => pieces.map(piece => {
                                    const taskId = `piece_${piece.id}`;
                                    const isDone = isTaskCompleted(taskId);
                                    const dailyGoal = calculateDailyMeasures(piece.measures, piece.targetDate);
                                    const daysLeft = calculateDaysRemaining(piece.targetDate);
                                    return (
                                        <div key={piece.id} className={`bg-white p-5 rounded-2xl border transition-all ${isDone ? 'opacity-60 grayscale' : 'shadow-sm hover:border-indigo-300'}`}>
                                            <div className="flex gap-4">
                                                <button onClick={() => updateDailyLog(taskId, !isDone)} className="mt-1 flex-shrink-0">
                                                    {isDone ? <CheckCircle className="text-indigo-500 w-6 h-6" /> : <div className="w-6 h-6 rounded-full border-2 border-slate-300" />}
                                                </button>
                                                <div className="flex-1">
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <div className={`text-[10px] font-bold px-2 py-0.5 rounded inline-block mb-1 ${ERAS.find(e=>e.id===key).color}`}>{ERAS.find(e=>e.id===key).name.split(' ')[0]}</div>
                                                            <h4 className="font-bold text-lg">{piece.title}</h4>
                                                            <p className="text-sm text-slate-500">{piece.movement}</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="text-2xl font-bold text-indigo-600">{dailyGoal}</div>
                                                            <div className="text-[10px] text-slate-400">m/day</div>
                                                        </div>
                                                    </div>
                                                    <div className="flex justify-between mt-4 text-xs text-slate-400">
                                                        <div className="flex gap-1 items-center"><Clock size={12}/>{daysLeft} days left</div>
                                                        <div>Total: {piece.measures} m.</div>
                                                    </div>
                                                    <ProgressBar current={dailyGoal} total={50} colorClass={daysLeft < 7 ? "bg-rose-500" : "bg-indigo-500"}/>
                                                </div>
                                            </div>
                                        </div>
                                    )
                                })))}
                            </div>
                        )}

                        {activeTab === 'plan' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-bold text-slate-900">曲目規劃</h2>
                                    <button onClick={() => setIsSemesterModalOpen(true)} className="flex gap-2 bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg"><Plus size={16}/> 新增學期</button>
                                </div>
                                {semesters.map(semester => (
                                    <div key={semester.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                        <div className="bg-slate-50 px-5 py-4 border-b flex justify-between items-center">
                                            <h3 className="font-bold text-lg">{semester.name}</h3>
                                            <button onClick={() => setSemesterToDelete(semester.id)} className="text-slate-300 hover:text-rose-500"><Trash2 size={18}/></button>
                                        </div>
                                        <div className="p-5 grid gap-4">
                                            {ERAS.map(era => (
                                                <div key={era.id} className="border rounded-xl overflow-hidden">
                                                    <div className={`px-4 py-3 flex justify-between items-center ${era.color}`}>
                                                        <span className="font-bold text-sm">{era.name}</span>
                                                        <AddPieceButton onAdd={(data) => {
                                                            setSemesters(semesters.map(s => s.id === semester.id ? {...s, eras: {...s.eras, [era.id]: [...s.eras[era.id], {...data, id: Date.now()}]}} : s));
                                                        }} />
                                                    </div>
                                                    <div className="bg-slate-50 p-3 space-y-2">
                                                        {semester.eras[era.id].length === 0 ? <div className="text-center text-xs text-slate-300 py-4">無曲目</div> : 
                                                            semester.eras[era.id].map(p => (
                                                                <div key={p.id} className="bg-white p-3 rounded-lg border flex justify-between items-center group relative">
                                                                    <div><div className="font-bold text-sm">{p.title}</div><div className="text-xs text-slate-500">{p.movement}</div></div>
                                                                    <button onClick={() => setSemesters(semesters.map(s => s.id === semester.id ? {...s, eras: {...s.eras, [era.id]: s.eras[era.id].filter(x => x.id !== p.id)}} : s))} className="text-slate-300 hover:text-rose-500"><Trash2 size={14}/></button>
                                                                </div>
                                                            ))
                                                        }
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'calendar' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold">練琴日曆</h2>
                                {/* Simple Calendar Placeholder - Fully implemented in previous version */}
                                <div className="bg-white rounded-3xl shadow-sm border p-6 text-center text-slate-400">
                                    日曆功能已啟用，紀錄會自動顯示於此。
                                </div>
                                <div className="bg-gradient-to-r from-violet-500 to-fuchsia-500 rounded-3xl p-6 text-white shadow-lg">
                                    <div className="flex gap-2 items-center mb-2"><Sunrise size={20}/> <h3 className="font-bold text-lg">明日預告</h3></div>
                                    <div className="bg-white/10 rounded-xl p-4 border border-white/20">
                                        <div className="text-xs font-bold uppercase mb-1 opacity-80">Tomorrow's Scale</div>
                                        <div className="font-bold text-xl">{tomorrowScales.major}</div>
                                        <div className="text-sm opacity-90">{tomorrowScales.minor}</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'settings' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold">資料設定</h2>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <p className="text-sm text-slate-500 mb-6">由於此為網頁版 App，資料儲存於本機瀏覽器中。若要在不同裝置間同步，請使用備份功能。</p>
                                    <div className="flex gap-4 flex-col md:flex-row">
                                        <button onClick={exportData} className="flex-1 flex items-center justify-center gap-2 bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">
                                            <Download size={18} /> 下載備份 (Export)
                                        </button>
                                        <label className="flex-1 flex items-center justify-center gap-2 bg-white text-slate-700 border-2 border-slate-200 py-3 rounded-xl font-bold cursor-pointer hover:bg-slate-50 transition">
                                            <Upload size={18} /> 匯入備份 (Import)
                                            <input type="file" accept=".json" onChange={importData} className="hidden" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Add Semester Modal */}
                    {isSemesterModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm">
                                <h3 className="font-bold text-lg mb-4">新增學期</h3>
                                <input className="w-full bg-slate-50 border rounded-xl p-3 mb-6" placeholder="例如: 2026 春季" value={newSemesterName} onChange={e => setNewSemesterName(e.target.value)} autoFocus />
                                <div className="flex gap-3"><button onClick={() => setIsSemesterModalOpen(false)} className="flex-1 py-2 font-bold text-slate-500">取消</button><button onClick={handleAddSemester} className="flex-1 py-2 font-bold bg-slate-900 text-white rounded-xl">建立</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AddPieceButton({ onAdd }) {
            const [isOpen, setIsOpen] = useState(false);
            const [formData, setFormData] = useState({ title: '', movement: '', measures: '', targetDate: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.title || !formData.measures || !formData.targetDate) return alert("請填寫完整資訊");
                onAdd(formData);
                setFormData({ title: '', movement: '', measures: '', targetDate: '' });
                setIsOpen(false);
            };

            if (!isOpen) return <button onClick={() => setIsOpen(true)} className="w-6 h-6 flex items-center justify-center bg-white/50 hover:bg-white rounded-lg text-slate-600"><Plus size={16} strokeWidth={3}/></button>;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm">
                        <h3 className="font-bold text-lg mb-4">新增曲目 (鋼琴)</h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input className="w-full border rounded-xl p-2.5" placeholder="曲名" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} autoFocus />
                            <input className="w-full border rounded-xl p-2.5" placeholder="樂章 (選填)" value={formData.movement} onChange={e => setFormData({...formData, movement: e.target.value})} />
                            <div className="flex gap-3">
                                <input type="number" className="flex-1 border rounded-xl p-2.5" placeholder="總小節" value={formData.measures} onChange={e => setFormData({...formData, measures: e.target.value})} />
                                <input type="date" className="flex-1 border rounded-xl p-2.5" value={formData.targetDate} onChange={e => setFormData({...formData, targetDate: e.target.value})} />
                            </div>
                            <div className="flex gap-3 pt-2">
                                <button type="button" onClick={() => setIsOpen(false)} className="flex-1 py-2 font-bold text-slate-500">取消</button>
                                <button type="submit" className="flex-1 py-2 font-bold bg-indigo-600 text-white rounded-xl">新增</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<PianoPracticeTracker />);
    </script>
</body>
</html>
